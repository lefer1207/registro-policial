<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <meta http-equiv='cache-control' content='no-cache, must-revalidate, post-check=0, pre-check=0'>
    <meta http-equiv='expires' content='0'>
    <meta http-equiv='pragma' content='no-cache'>
    <title>REGISTRO POLICIAL V39</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css'>
    <script>
        // ELIMINACIÓN AGRESIVA DE SERVICE WORKERS VIEJOS
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }
        // LIMPIEZA DE CACHES DEL NAVEGADOR
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }
    </script>
</head>
<body class='bg-black text-white'>
    <div id='pin-screen' class='fixed inset-0 flex flex-col items-center justify-center p-6 text-center z-[200] bg-black'>
        <div class='mb-8 animate-bounce'>
            <i class='fas fa-shield-halved text-7xl text-blue-500'></i>
        </div>
        <h1 class='text-5xl font-black text-white mb-2 tracking-tighter'>VERSIÓN 39.0</h1>
        <p class='text-blue-400 mb-10 uppercase tracking-widest text-[10px] font-bold'>SISTEMA ACTUALIZADO</p>
        
        <div class='bg-slate-900 p-8 rounded-[40px] w-full max-w-xs shadow-2xl border border-slate-800'>
            <input type='password' id='pin-input' placeholder='PIN' class='w-full p-5 rounded-3xl text-center text-3xl mb-6 bg-black text-white border border-slate-700 outline-none focus:border-blue-500 font-black'>
            <button onclick='entrar()' class='w-full bg-blue-600 hover:bg-blue-500 text-white py-5 rounded-3xl font-black text-xl transition-all active:scale-95 shadow-[0_0_20px_rgba(37,99,235,0.4)]'>INGRESAR</button>
        </div>

        <button onclick='location.reload(true)' class='mt-12 text-slate-500 text-[10px] font-bold uppercase tracking-widest'>
            <i class='fas fa-sync-alt mr-2'></i> RECARGAR FORZADO
        </button>
    </div>

    <div id='app' class='hidden bg-slate-100 text-slate-900 min-h-screen'>
        <header class='bg-slate-900 text-white p-5 sticky top-0 z-50 shadow-2xl border-b border-blue-900/30'>
            <div class='flex justify-between items-center mb-4'>
                <h1 class='font-black italic text-xl tracking-tighter'>REGISTRO <span class='text-blue-500'>PRO</span></h1>
                <div id='count' class='bg-blue-600 px-3 py-1 rounded-full text-[10px] font-black'>0</div>
            </div>
            <div class='relative'>
                <i class='fas fa-search absolute left-4 top-4 text-slate-500'></i>
                <input type='text' id='bus' oninput='filtrar()' placeholder='BUSCAR...' class='w-full p-4 pl-12 rounded-2xl bg-white text-slate-900 text-sm outline-none shadow-inner font-bold border-none'>
            </div>
        </header>

        <main class='p-4'>
            <div class='grid grid-cols-2 gap-4 mb-6'>
                <button onclick='abrirF(false)' class='bg-blue-900 text-white p-6 rounded-3xl shadow-xl flex flex-col items-center justify-center active:scale-95 border-b-4 border-blue-700'>
                    <i class='fas fa-user-plus text-2xl mb-2'></i>
                    <span class='text-[10px] font-black uppercase tracking-tighter'>NUEVA PERSONA</span>
                </button>
                <button onclick='abrirF(true)' class='bg-slate-700 text-white p-6 rounded-3xl shadow-xl flex flex-col items-center justify-center active:scale-95 border-b-4 border-slate-600'>
                    <i class='fas fa-car text-2xl mb-2'></i>
                    <span class='text-[10px] font-black uppercase tracking-tighter'>NUEVA MATRÍCULA</span>
                </button>
            </div>
            <div id='lista' class='grid gap-3 pb-24'></div>
        </main>

        <!-- FORMULARIO -->
        <div id='form-view' class='fixed inset-0 bg-white z-[150] hidden flex flex-col p-6 overflow-y-auto'>
            <div onclick='cerrarF()' class='mb-8 flex items-center font-black text-sm uppercase text-slate-400'>
                <i class='fas fa-arrow-left mr-3'></i> VOLVER
            </div>
            <h2 id='f-t' class='text-3xl font-black uppercase italic mb-8 border-b-8 border-slate-900 pb-2 text-slate-900 tracking-tighter'></h2>
            <div class='space-y-5 pb-20'>
                <div id='f-n-c'><label class='text-[11px] font-black text-slate-400 uppercase ml-2'>Nombre Completo</label><input id='in-n' type='text' class='w-full p-5 rounded-[25px] bg-slate-100 border-none outline-none font-bold text-lg'></div>
                <div id='f-c-c'><label class='text-[11px] font-black text-slate-400 uppercase ml-2'>Cédula de Identidad</label><input id='in-c' type='text' class='w-full p-5 rounded-[25px] bg-slate-100 border-none outline-none font-bold text-lg'></div>
                <div><label class='text-[11px] font-black text-slate-400 uppercase ml-2'>Domicilio</label><input id='in-d' type='text' class='w-full p-5 rounded-[25px] bg-slate-100 border-none outline-none font-bold text-lg'></div>
                <div><label class='text-[11px] font-black text-slate-400 uppercase ml-2'>Teléfono</label><input id='in-t' type='text' class='w-full p-5 rounded-[25px] bg-slate-100 border-none outline-none font-bold text-lg'></div>
                <div><label class='text-[11px] font-black text-slate-400 uppercase ml-2'>Matrícula / Vehículo</label><input id='in-v' type='text' class='w-full p-5 rounded-[25px] bg-slate-100 border-none outline-none font-bold text-lg'></div>
                <div><label class='text-[11px] font-black text-red-600 uppercase italic ml-2'>Antecedentes y Notas</label><textarea id='in-no' rows='6' class='w-full p-6 rounded-[30px] bg-red-50 border-2 border-red-100 outline-none font-bold text-red-900 text-sm shadow-inner'></textarea></div>
                <button onclick='save()' class='w-full bg-blue-700 text-white py-6 rounded-[30px] font-black uppercase text-xl shadow-2xl active:scale-95'>💾 GUARDAR REGISTRO</button>
            </div>
        </div>

        <!-- DETALLES -->
        <div id='det-view' class='fixed inset-0 bg-black/95 z-[160] hidden flex items-center justify-center p-4' onclick='this.classList.add("hidden")'>
            <div class='bg-white w-full max-w-md rounded-[50px] p-10 shadow-2xl relative' onclick='event.stopPropagation()'>
                <h2 id='d-n' class='text-3xl font-black uppercase italic text-slate-900 border-b-4 border-blue-600 pb-4 mb-8 leading-tight tracking-tighter'></h2>
                <div class='space-y-8 max-h-[55vh] overflow-y-auto pr-2'>
                    <div><p class='text-[11px] font-black text-slate-400 uppercase mb-1'>Documento</p><p id='d-c' class='text-blue-700 font-black text-3xl tracking-tighter'></p></div>
                    <div><p class='text-[11px] font-black text-slate-400 uppercase mb-1'>Dirección</p><p id='d-d' class='text-slate-800 font-bold text-xl leading-snug'></p></div>
                    <div><p class='text-[11px] font-black text-red-500 uppercase italic mb-2'>Antecedentes</p><div id='d-no' class='text-red-700 font-black leading-tight text-sm whitespace-pre-wrap bg-red-50 p-6 rounded-[30px] border border-red-100 shadow-inner'></div></div>
                </div>
                <button onclick='document.getElementById("det-view").classList.add("hidden")' class='mt-10 w-full bg-slate-900 text-white py-6 rounded-3xl font-black uppercase text-lg shadow-xl'>CERRAR</button>
            </div>
        </div>
    </div>

    <script>
        const SB = 'https://pdoeklmwquxggppvigrf.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';
        let db = [];
        let isMat = false;

        function entrar() {
            if (document.getElementById('pin-input').value === '3268') {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                const cache = localStorage.getItem('db_final_police');
                if(cache) {
                    db = JSON.parse(cache);
                    document.getElementById('count').innerText = db.length;
                    draw(db);
                } else { 
                    localStorage.clear();
                    location.reload(true);
                }
            } else { alert('PIN INCORRECTO'); }
        }

        function abrirF(m) {
            isMat = m;
            document.getElementById('f-t').innerText = m ? 'Matrícula' : 'Persona';
            document.getElementById('f-n-c').style.display = m ? 'none' : 'block';
            document.getElementById('f-c-c').style.display = m ? 'none' : 'block';
            document.getElementById('form-view').classList.remove('hidden');
        }

        function cerrarF() { document.getElementById('form-view').classList.add('hidden'); }

        async function save() {
            const n = document.getElementById('in-n').value;
            const v = document.getElementById('in-v').value;
            if(!isMat && !n) return alert('Nombre Requerido');
            
            const payload = { 
                nombre: isMat ? 'MATRÍCULA: ' + v : n, 
                ci: document.getElementById('in-c').value, 
                domicilio: document.getElementById('in-d').value, 
                telefono: document.getElementById('in-t').value, 
                vehiculo1: v, 
                notas: document.getElementById('in-no').value 
            };

            try {
                const r = await fetch(SB + '/rest/v1/personas', {
                    method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                    body: JSON.stringify(payload)
                });
                if(r.ok) {
                    alert('GUARDADO OK');
                    db.unshift(payload);
                    localStorage.setItem('db_final_police', JSON.stringify(db));
                    draw(db);
                    cerrarF();
                }
            } catch(e) { alert('Error de Red'); }
        }

        function draw(data) {
            const list = document.getElementById('lista');
            list.innerHTML = data.map(p => `
                <div onclick="showDet('${p.id || p.ci || p.nombre}')" class='bg-white p-6 rounded-[30px] shadow-sm border-l-[10px] border-blue-900 flex justify-between items-center mb-2 active:scale-95 transition-all'>
                    <div class='overflow-hidden'>
                        <h3 class='font-black uppercase text-slate-800 text-[13px] truncate tracking-tighter'>${p.nombre || 'SIN NOMBRE'}</h3>
                        <p class='text-[10px] text-slate-400 font-black tracking-widest'>${p.ci ? 'CI: '+p.ci : (p.vehiculo1 ? 'MAT: '+p.vehiculo1 : '---')}</p>
                    </div>
                    <i class='fas fa-chevron-right text-slate-300'></i>
                </div>`).join('');
        }

        function showDet(id) {
            const p = db.find(x => String(x.id || x.ci || x.nombre) === String(id));
            if(!p) return;
            document.getElementById('d-n').innerText = p.nombre || 'SIN NOMBRE';
            document.getElementById('d-c').innerText = p.ci || '---';
            document.getElementById('d-d').innerText = p.domicilio || p.direccion || '---';
            document.getElementById('d-no').innerText = (p.antecedentes ? 'ANTECEDENTES:\n'+p.antecedentes+'\n\n' : '') + (p.notas || 'S/N');
            document.getElementById('det-view').classList.remove('hidden');
        }

        function filtrar() {
            const t = document.getElementById('bus').value.toLowerCase().trim();
            if(!t) return draw(db);
            draw(db.filter(p => (p.nombre||'').toLowerCase().includes(t) || (p.ci||'').includes(t) || (p.vehiculo1||'').toLowerCase().includes(t)));
        }
    </script>
</body>
</html>
