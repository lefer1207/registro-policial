<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro Policial</title>
  <style>
    :root { --primary: #1a3a5c; --secondary: #2c5f8a; --accent: #e8a020; --danger: #c0392b; --bg: #f0f2f5; --card: #ffffff; --text: #1a1a2e; --muted: #6c7a8d; --border: #d0d7e3; --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.10); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--primary); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .loader-overlay { position: fixed; inset: 0; background: rgba(26,58,92,0.18); z-index: 999; display: flex; align-items: center; justify-content: center; }
    .loader-overlay.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.88rem; z-index: 998; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); display: flex; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,0.15); }
    nav button { flex: 1; background: none; border: none; color: rgba(255,255,255,0.65); padding: 12px 4px 10px; font-size: 0.7rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.2s; }
    nav button.active { color: var(--accent); }
    nav button span.icon { font-size: 1.4rem; }
    main { padding: 16px 14px 80px; max-width: 600px; margin: 0 auto; }
    .view { display: none; } .view.active { display: block; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-bar input { flex: 1; padding: 10px 14px; border: 1.5 solid var(--border); border-radius: var(--radius); font-size: 0.95rem; background: var(--card); color: var(--text); }
    .fab { position: fixed; bottom: 72px; right: 18px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.7rem; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; z-index: 99; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 0.93rem; }
    .chip { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; background: var(--secondary); color: #fff; margin: 2px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--card); border-radius: 18px 18px 0 0; padding: 20px 16px 30px; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
  </style>
</head>
<body>
<div class="loader-overlay hidden" id="loader"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>
<header><h1>🛡️ Registro Policial</h1></header>
<nav>
  <button class="active" onclick="showTab('personas')" id="tab-personas"><span class="icon">👤</span>Personas</button>
  <button onclick="showTab('vehiculos')" id="tab-vehiculos"><span class="icon">🚗</span>Vehículos</button>
  <button onclick="showTab('buscar')" id="tab-buscar"><span class="icon">🔍</span>Buscar</button>
</nav>
<main>
  <!-- PERSONAS -->
  <div class="view active" id="view-personas">
    <div class="search-bar"><input type="search" id="searchPersonas" placeholder="Buscar por nombre o CI..." oninput="buscarPersonas()"></div>
    <div id="listaPersonas"></div>
    <div class="pagination" id="paginacionPersonas"></div>
  </div>
  <!-- VEHÍCULOS -->
  <div class="view" id="view-vehiculos">
    <div class="search-bar"><input type="search" id="searchVehiculos" placeholder="Buscar por matrícula o marca..." oninput="buscarVehiculos()"></div>
    <div id="listaVehiculos"></div>
    <div class="pagination" id="paginacionVehiculos"></div>
  </div>
  <!-- BÚSQUEDA GLOBAL -->
  <div class="view" id="view-buscar">
    <div class="search-bar"><input type="search" id="searchGlobal" placeholder="Buscar en todo el registro..." oninput="buscarGlobal()"></div>
    <div id="resultadosBusqueda"></div>
  </div>
  <!-- DETALLE PERSONA -->
  <div class="view" id="view-detalle-persona"><button class="btn" onclick="goBack()" style="margin-bottom:15px;">← Volver</button><div id="detallePersonaContent"></div></div>
  <!-- DETALLE VEHÍCULO -->
  <div class="view" id="view-detalle-vehiculo"><button class="btn" onclick="goBack()" style="margin-bottom:15px;">← Volver</button><div id="detalleVehiculoContent"></div></div>
  <!-- FORM PERSONA -->
  <div class="view" id="view-form-persona">
    <button class="btn" onclick="goBack()" style="margin-bottom:15px;">← Cancelar</button>
    <div class="section-title" id="formPersonaTitulo" style="font-weight:bold;font-size:1.1rem;margin-bottom:15px;">Nueva Persona</div>
    <div class="form-section">
      <h3>Foto</h3>
      <div onclick="document.getElementById('photoInput').click()" style="text-align:center;padding:15px;border:1px dashed #ccc;border-radius:10px;cursor:pointer;margin-bottom:15px;">
        <div id="photoPreviewContainer">📷<br>Agregar Foto</div>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhoto(event)">
      <h3>Datos</h3>
      <div class="form-group"><label>Nombre completo *</label><input type="text" id="fpNombre"></div>
      <div class="form-group"><label>CI</label><input type="text" id="fpCI"></div>
      <div class="form-group"><label>Fecha de nacimiento</label><input type="text" id="fpFechaNac" placeholder="DD/MM/AAAA"></div>
      <div class="form-group"><label>Domicilio</label><input type="text" id="fpDomicilio"></div>
      <div class="form-group"><label>Teléfono</label><input type="text" id="fpTelefono"></div>
      <h3>Vehículos y Vínculos</h3>
      <div class="form-group"><div id="fpVehiculosSeleccionados"></div><button onclick="openModalVehiculos()" class="btn btn-ghost btn-sm">+ Asociar Vehículo</button></div>
      <div class="form-group"><div id="fpVinculosSeleccionados"></div><button onclick="openModalVinculos()" class="btn btn-ghost btn-sm">+ Agregar Vínculo</button></div>
      <h3>Antecedentes</h3>
      <textarea id="fpNotas" style="width:100%;height:100px;border-radius:10px;border:1.5px solid #d0d7e3;padding:10px;"></textarea>
      <input type="hidden" id="fpId">
      <button class="btn btn-primary" onclick="guardarPersona()" style="width:100%;padding:15px;margin-top:20px;font-weight:bold;">GUARDAR</button>
    </div>
  </div>
</main>
<button class="fab" id="fabBtn" onclick="onFabClick()">+</button>

<script>
// USAMOS TU LLAVE LARGA ORIGINAL PARA QUE VUELVAN LOS 1910 REGISTROS
const SUPABASE_URL = 'https://pdoeklmwquxggppvigrf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dgzsdZ2CCSet9y4FJ9QmrQ_RQKwqJXe';

const api = async (method, table, body, params) => {
  let url = `\({SUPABASE_URL}/rest/v1/\){table}${params ? '?' + params : ''}`;
  const opts = { method, headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
};
const sb = { get: (t, p) => api('GET', t, null, p), post: (t, b) => api('POST', t, b), patch: (t, b, p) => api('PATCH', t, b, p), delete: (t, p) => api('DELETE', t, null, p) };

// ARREGLO DE FECHA PARA 31/10/1988
function arreglarFecha(raw) {
  if (!raw) return null;
  if (raw.includes('/')) {
    const p = raw.split('/');
    if (p.length === 3 && p[2].length === 4) return `\({p[2]}-\){p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
  }
  return raw;
}

// ESTADOS Y NAVEGACIÓN
let personasPage = 0, PAGE_SIZE = 30, tempPhoto = null, viewStack = [];
function showLoader() { document.getElementById('loader').classList.remove('hidden'); }
function hideLoader() { document.getElementById('loader').classList.add('hidden'); }
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }

async function renderPersonas(q='') {
  showLoader();
  try {
    const from = personasPage * PAGE_SIZE;
    let params = `select=id,nombre,ci,domicilio,foto&order=nombre.asc&limit=\({PAGE_SIZE}&offset=\){from}`;
    if (q) params += `&or=(nombre.ilike.*\({q}*,ci.ilike.*\){q}*)`;
    const personas = await sb.get('personas', params);
    document.getElementById('listaPersonas').innerHTML = personas.map(p => `
      <div class="card" onclick="verPersona('${p.id}')">
        <div class="avatar">\({p.foto ? `<img src="\){p.foto}">` : p.nombre[0]}</div>
        <div class="card-info"><b>\({p.nombre}</b><br><small>\){p.ci || ''} • ${p.domicilio || ''}</small></div>
      </div>`).join('');
    document.getElementById('paginacionPersonas').innerHTML = `<button onclick="cambiarPaginaPersonas(-1)" \({personasPage===0?'disabled':''}>Anterior</button> <span>Pág. \){personasPage+1}</span> <button onclick="cambiarPaginaPersonas(1)" ${personas.length<PAGE_SIZE?'disabled':''}>Siguiente</button>`;
  } finally { hideLoader(); }
}
function cambiarPaginaPersonas(d) { personasPage += d; renderPersonas(); }
function showTab(t) { document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById('view-'+t).classList.add('active'); if(t==='personas') renderPersonas(); }
function onFabClick() { showTab('form-persona'); }
function goBack() { showTab('personas'); }

async function guardarPersona() {
  const nombre = document.getElementById('fpNombre').value.trim();
  if (!nombre) return;
  showLoader();
  const id = document.getElementById('fpId').value;
  const data = { nombre, ci: document.getElementById('fpCI').value, fecha_nac: arreglarFecha(document.getElementById('fpFechaNac').value), domicilio: document.getElementById('fpDomicilio').value, telefono: document.getElementById('fpTelefono').value, notas: document.getElementById('fpNotas').value, foto: tempPhoto };
  try {
    if (id) await sb.patch('personas', data, `id=eq.${id}`); else await sb.post('personas', data);
    showToast('¡Guardado!');
    location.reload();
  } finally { hideLoader(); }
}

function handlePhoto(e) { const f = e.target.files[0]; const r = new FileReader(); r.onload = ev => { tempPhoto = ev.target.result; document.getElementById('photoPreviewContainer').innerHTML = `<img src="${tempPhoto}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;">`; }; r.readAsDataURL(f); }

renderPersonas();
</script>
</body>
</html>
