<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Registro Pro v19.1</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css'>
</head>
<body class='bg-slate-100'>
    <div id='pin-screen' class='fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-white'>
        <i class='fas fa-shield-halved text-6xl mb-6 text-blue-400'></i>
        <h2 class='text-2xl font-bold mb-6'>Registro Policial</h2>
        <input type='password' id='pin-input' placeholder='PIN' class='border-none p-4 rounded-xl w-full max-w-xs text-center text-2xl mb-4 bg-slate-800 text-white outline-none'>
        <button onclick='verificarPIN()' class='bg-blue-600 text-white px-8 py-4 rounded-xl font-bold w-full max-w-xs shadow-lg'>ENTRAR</button>
        <p class='mt-10 text-slate-500 text-xs'>v19.1 (Carga Asegurada)</p>
    </div>

    <div id='app' class='hidden flex flex-col min-h-screen'>
        <header class='bg-slate-800 text-white p-4 sticky top-0 shadow-xl z-40'>
            <div class='flex justify-between items-center mb-3'>
                <h1 class='text-lg font-bold'>REGISTRO PRO</h1>
                <span id='count-badge' class='bg-blue-600 text-xs px-2 py-1 rounded-full'>0</span>
            </div>
            <input type='text' id='buscador' oninput='filtrar()' placeholder='🔍 Buscar...' class='w-full p-3 rounded-xl text-black outline-none bg-white'>
        </header>

        <main class='p-4'>
            <div id='status-container' class='bg-white p-6 rounded-2xl shadow-sm text-center mb-6'>
                <p id='status-text' class='text-slate-600 font-bold'>Base de datos lista</p>
                <button id='btn-cargar' onclick='cargarDatos()' class='mt-4 w-full bg-blue-700 text-white py-4 rounded-xl font-bold'>
                   👆 TOCAR PARA CARGAR
                </button>
                <p id='error-hint' class='hidden text-red-500 text-xs mt-2 italic'>Si no avanza, apague el Wi-Fi</p>
            </div>
            <div id='contenedor-personas' class='grid gap-3 pb-20'></div>
        </main>
    </div>

    <script>
        const SB = 'https://pdoeklmwquxggppvigrf.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';
        let db = [];

        function verificarPIN() {
            if (document.getElementById('pin-input').value === '3268') {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
            } else { alert('PIN Incorrecto'); }
        }

        async function cargarDatos() {
            const statusText = document.getElementById('status-text');
            const btn = document.getElementById('btn-cargar');
            const badge = document.getElementById('count-badge');
            const hint = document.getElementById('error-hint');
            
            btn.classList.add('hidden');
            hint.classList.add('hidden');
            statusText.innerHTML = '⏳ Conectando...';
            db = [];

            try {
                let offset = 0;
                let limit = 150; // Bloques más pequeños para mayor seguridad
                let hasMore = true;

                while (hasMore) {
                    const res = await fetch(SB + '/rest/v1/personas?select=nombre,ci&order=nombre.asc&offset=' + offset + '&limit=' + limit, {
                        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
                    });
                    const data = await res.json();
                    
                    if (data && data.length > 0) {
                        db = db.concat(data);
                        offset += limit;
                        statusText.innerHTML = '✅ Cargados: ' + db.length;
                        badge.innerText = db.length;
                        dibujar(db);
                        if (data.length < limit) hasMore = false;
                    } else { hasMore = false; }
                }
                setTimeout(() => { document.getElementById('status-container').style.display = 'none'; }, 1000);
            } catch (err) {
                statusText.innerHTML = '❌ Error de Conexión';
                btn.classList.remove('hidden');
                hint.classList.remove('hidden');
            }
        }

        function dibujar(datos) {
            document.getElementById('contenedor-personas').innerHTML = datos.map(p => `
                <div class='bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-900'>
                    <h3 class='font-bold uppercase text-slate-800 text-sm'>${p.nombre || 'S/N'}</h3>
                    <p class='text-xs text-slate-500 font-mono'>CI: ${p.ci || 'S/D'}</p>
                </div>`).join('');
        }

        function filtrar() {
            const txt = document.getElementById('buscador').value.toLowerCase().trim();
            dibujar(db.filter(p => (p.nombre || '').toLowerCase().includes(txt) || (p.ci || '').toString().includes(txt)));
        }
    </script>
</body>
</html>
