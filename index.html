<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Registro Pro v17</title>
    <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-gray-100 min-h-screen'>
    <div id='pin-screen' class='fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6'>
        <h2 class='text-2xl font-bold mb-6 text-gray-800'>Acceso Seguro</h2>
        <input type='password' id='pin-input' placeholder='PIN' class='border-2 border-gray-300 p-4 rounded-xl w-full max-w-xs text-center text-2xl mb-4 outline-none'>
        <button onclick='verificarPIN()' class='bg-blue-600 text-white px-8 py-4 rounded-xl font-bold w-full max-w-xs shadow-lg'>ENTRAR</button>
        <p class='mt-10 text-gray-400 text-xs'>v17.0 (Reset Total)</p>
    </div>

    <div id='app' class='hidden'>
        <header class='bg-gray-800 text-white p-4 sticky top-0 shadow-md'>
            <h1 class='text-lg font-bold'>Registro Policial Pro</h1>
            <input type='text' id='buscador' oninput='filtrar()' placeholder='🔎 Buscar...' class='w-full mt-2 p-3 rounded text-black outline-none'>
        </header>
        <main class='p-4'>
            <div id='status' class='text-center py-10'>
                <p class='text-gray-600 font-bold'>⌛ Cargando base de datos...</p>
                <button onclick='cargarDatos()' class='mt-4 bg-gray-500 text-white px-4 py-2 rounded'>Reintentar</button>
            </div>
            <div id='contenedor-personas' class='space-y-3'></div>
        </main>
    </div>

    <script>
        const SB = 'https://pdoeklmwquxggppvigrf.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';
        let db = [];

        function verificarPIN() {
            if (document.getElementById('pin-input').value === '3268') {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                cargarDatos();
            } else { alert('PIN Incorrecto'); }
        }

        async function cargarDatos() {
            try {
                const res = await fetch(SB + '/rest/v1/personas?select=nombre,ci,direccion&order=nombre.asc&limit=300', {
                    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
                });
                db = await res.json();
                document.getElementById('status').style.display = 'none';
                dibujar(db);
            } catch (err) {
                document.getElementById('status').innerHTML = '<p class="text-red-500">Error de red. Use Datos Móviles.</p>';
            }
        }

        function dibujar(datos) {
            document.getElementById('contenedor-personas').innerHTML = datos.map(p => `
                <div class='bg-white p-4 rounded shadow border-l-4 border-gray-500'>
                    <h3 class='font-bold uppercase text-gray-800'>${p.nombre || 'Sin nombre'}</h3>
                    <p class='text-sm text-gray-600'>CI: ${p.ci || 'S/D'}</p>
                </div>`).join('');
        }

        function filtrar() {
            const txt = document.getElementById('buscador').value.toLowerCase();
            dibujar(db.filter(p => (p.nombre || '').toLowerCase().includes(txt) || (p.ci || '').includes(txt)));
        }
    </script>
</body>
</html>
