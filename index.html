<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Registro Policial Pro</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css'>
    <style>
        .persona-card { border-left: 5px solid #1e3a8a; }
        .persona-card:active { background-color: #f1f5f9; }
    </style>
</head>
<body class='bg-slate-100'>
    <!-- PIN -->
    <div id='pin-screen' class='fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-white text-center'>
        <i class='fas fa-shield-halved text-6xl mb-6 text-blue-400'></i>
        <h2 class='text-2xl font-bold'>REGISTRO POLICIAL</h2>
        <p class='text-slate-500 mb-6 text-xs'>v25.0 - Motor de Emergencia</p>
        <input type='password' id='pin-input' placeholder='PIN' class='border-none p-4 rounded-xl w-full max-w-xs text-center text-2xl mb-4 bg-slate-800 text-white outline-none'>
        <button onclick='verificarPIN()' class='bg-blue-600 text-white px-8 py-4 rounded-xl font-bold w-full max-w-xs shadow-lg'>ENTRAR</button>
    </div>

    <div id='app' class='hidden flex flex-col min-h-screen'>
        <header class='bg-slate-800 text-white p-4 sticky top-0 shadow-xl z-40'>
            <div class='flex justify-between items-center mb-3'>
                <h1 class='text-lg font-bold'><i class='fas fa-id-badge mr-2'></i>REGISTRO</h1>
                <span id='count-badge' class='bg-blue-600 text-xs px-2 py-1 rounded-full font-mono'>0</span>
            </div>
            <input type='text' id='buscador' oninput='filtrar()' placeholder='🔍 Buscar...' class='w-full p-3 rounded-xl text-black outline-none'>
        </header>

        <main class='p-4'>
            <!-- BOTÓN DE CARGA DE EMERGENCIA -->
            <div id='emergency-loader' class='bg-white p-6 rounded-2xl shadow-md border-2 border-red-100 text-center mb-6'>
                <p class='text-slate-800 font-bold mb-2'>DATOS NO CARGADOS</p>
                <p class='text-slate-500 text-xs mb-4'>Si la lista está vacía, toque el botón de abajo:</p>
                <button onclick='descargaManual()' id='btn-descarga' class='w-full bg-blue-700 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-3'>
                   <i class='fas fa-cloud-download-alt'></i> SINCRONIZAR AHORA
                </button>
                <div id='prog-container' class='hidden mt-4'>
                    <p id='prog-text' class='text-xs font-bold text-blue-700 mb-2'>Iniciando...</p>
                    <div class='w-full bg-slate-200 rounded-full h-3'><div id='bar' class='bg-blue-600 h-3 rounded-full' style='width:0%'></div></div>
                </div>
            </div>
            
            <div id='lista' class='grid gap-3 pb-24'></div>
        </main>

        <!-- DETALLE -->
        <div id='modal' class='fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4' onclick='this.classList.add("hidden")'>
            <div class='bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl' onclick='event.stopPropagation()'>
                <h2 id='m-n' class='text-xl font-bold uppercase text-slate-800 border-b pb-2 mb-4 italic'></h2>
                <div class='space-y-4'>
                    <div><p class='text-[10px] font-bold text-slate-400'>CÉDULA</p><p id='m-c' class='text-blue-700 font-bold text-lg'></p></div>
                    <div><p class='text-[10px] font-bold text-slate-400'>DIRECCIÓN</p><p id='m-d' class='text-slate-700'></p></div>
                    <div><p class='text-[10px] font-bold text-slate-400 text-red-500'>NOTAS</p><p id='m-no' class='text-red-600 font-bold'></p></div>
                </div>
                <button onclick='document.getElementById("modal").classList.add("hidden")' class='mt-8 w-full bg-slate-800 text-white py-3 rounded-xl font-bold'>VOLVER</button>
            </div>
        </div>
    </div>

    <script>
        const SB = 'https://pdoeklmwquxggppvigrf.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';
        let db = [];

        function verificarPIN() {
            if (document.getElementById('pin-input').value === '3268') {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                // Intentar cargar caché si existe
                const cached = localStorage.getItem('db_cache_v25');
                if (cached) {
                    db = JSON.parse(cached);
                    document.getElementById('count-badge').innerText = db.length;
                    dibujar(db);
                    document.getElementById('emergency-loader').style.display = 'none';
                }
            } else { alert('PIN Incorrecto'); }
        }

        async function descargaManual() {
            const btn = document.getElementById('btn-descarga');
            const cont = document.getElementById('prog-container');
            const text = document.getElementById('prog-text');
            const bar = document.getElementById('bar');
            
            btn.classList.add('hidden');
            cont.classList.remove('hidden');
            db = [];
            
            try {
                let off = 0; let lim = 200; let more = true;
                while (more) {
                    const r = await fetch(SB + '/rest/v1/personas?select=*&order=nombre.asc&offset=' + off + '&limit=' + lim, {
                        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
                    });
                    const d = await r.json();
                    if (d && d.length > 0) {
                        db = db.concat(d);
                        off += lim;
                        text.innerText = 'DESCARGANDO: ' + db.length + ' REGISTROS';
                        bar.style.width = Math.min((db.length/1950)*100, 100) + '%';
                        document.getElementById('count-badge').innerText = db.length;
                        dibujar(db);
                        if (d.length < lim) more = false;
                    } else { more = false; }
                }
                localStorage.setItem('db_cache_v25', JSON.stringify(db));
                document.getElementById('emergency-loader').style.display = 'none';
            } catch (e) {
                alert('ERROR DE RED: Use Datos Móviles y vuelva a intentar.');
                btn.classList.remove('hidden');
                cont.classList.add('hidden');
            }
        }

        function dibujar(datos) {
            document.getElementById('lista').innerHTML = datos.map(p => `
                <div onclick='ver("${p.ci}")' class='bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-900 persona-card flex justify-between items-center'>
                    <div><h3 class='font-bold uppercase text-slate-800 text-sm'>${p.nombre || 'S/N'}</h3><p class='text-xs text-slate-500'>CI: ${p.ci || '---'}</p></div>
                    <i class='fas fa-chevron-right text-slate-300'></i>
                </div>`).join('');
        }

        function ver(ci) {
            const p = db.find(x => x.ci == ci);
            if(!p) return;
            document.getElementById('m-n').innerText = p.nombre || 'S/N';
            document.getElementById('m-c').innerText = p.ci || '---';
            document.getElementById('m-d').innerText = p.direccion || '---';
            document.getElementById('m-no').innerText = p.notas || '---';
            document.getElementById('modal').classList.remove('hidden');
        }

        function filtrar() {
            const t = document.getElementById('buscador').value.toLowerCase().trim();
            const f = db.filter(p => (p.nombre||'').toLowerCase().includes(t) || (p.ci||'').toString().includes(t));
            dibujar(f);
        }
    </script>
</body>
</html>
