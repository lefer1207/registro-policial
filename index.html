<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Registro Policial Pro</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css'>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f1f5f9; }
        .bg-header { background-color: #1e293b; }
        .bg-btn-persona { background-color: #1e3a8a; }
        .bg-btn-matricula { background-color: #334155; }
        .persona-card { border-left: 6px solid #1e3a8a; }
        .persona-card:active { background-color: #f1f5f9; transform: scale(0.98); }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id='pin-screen' class='fixed inset-0 bg-header z-50 flex flex-col items-center justify-center p-6 text-white text-center'>
        <i class='fas fa-shield-halved text-6xl mb-4 text-blue-400'></i>
        <h2 class='text-2xl font-bold mb-1 uppercase'>Registro Policial Pro</h2>
        <p class='text-slate-500 mb-8 text-[10px]'>v34.0 - FIX BOTONES Y DATOS</p>
        <input type='password' id='pin-input' placeholder='PIN' class='border-none p-4 rounded-2xl w-full max-w-xs text-center text-2xl mb-4 bg-slate-800 text-white outline-none'>
        <button onclick='entrar()' class='bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold w-full max-w-xs shadow-lg'>INGRESAR</button>
    </div>

    <div id='app' class='hidden flex flex-col min-h-screen'>
        <header class='bg-header text-white p-4 sticky top-0 shadow-2xl z-40'>
            <div class='flex justify-between items-center mb-4'>
                <h1 class='text-lg font-bold flex items-center'><i class='fas fa-id-badge mr-2'></i>REGISTRO</h1>
                <span id='count' class='bg-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold'>0</span>
            </div>
            <div class='relative'>
                <i class='fas fa-search absolute left-4 top-3.5 text-slate-400'></i>
                <input type='text' id='bus' oninput='filtrar()' placeholder='Buscar nombre o cédula...' class='w-full p-3 pl-12 rounded-2xl text-black outline-none border-none bg-white text-sm shadow-inner'>
            </div>
        </header>

        <main class='p-4'>
            <div class='grid grid-cols-2 gap-4 mb-6'>
                <button onclick='abrirForm()' class='bg-btn-persona text-white p-5 rounded-2xl text-[10px] font-bold shadow-md flex flex-col items-center uppercase tracking-tighter cursor-pointer'>
                    <i class='fas fa-user-plus text-2xl mb-2'></i>AGREGAR PERSONA
                </button>
                <button onclick='abrirVehiculo()' class='bg-btn-matricula text-white p-5 rounded-2xl text-[10px] font-bold shadow-md flex flex-col items-center uppercase tracking-tighter cursor-pointer'>
                    <i class='fas fa-car text-2xl mb-2'></i>AGREGAR MATRICULA
                </button>
            </div>

            <div id='sync-zone' class='bg-white p-6 rounded-3xl shadow-sm border-2 border-dashed border-blue-200 text-center mb-6 hidden'>
                <p id='st-status' class='text-blue-600 font-bold text-sm mb-4 uppercase italic'>Buscando datos...</p>
                <button onclick='sincronizar()' id='btn-sync' class='w-full bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-xl flex items-center justify-center gap-3'>
                    <i class='fas fa-sync-alt'></i> REINTENTAR CARGA
                </button>
                <div id='prog' class='mt-4'>
                    <div class='w-full bg-slate-100 rounded-full h-4 overflow-hidden shadow-inner'><div id='bar' class='bg-blue-600 h-full transition-all duration-300' style='width:0%'></div></div>
                    <p id='st-count' class='text-[11px] font-bold text-blue-800 mt-3'>Cargando...</p>
                </div>
            </div>

            <div id='lista' class='grid gap-3 pb-24'></div>
        </main>

        <!-- MODAL DE DETALLES - REPARADO CON ID -->
        <div id='modal' class='fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4' onclick='cerrarModal()'>
            <div class='bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl relative animate-in zoom-in duration-200' onclick='event.stopPropagation()'>
                <h2 id='m-n' class='text-xl font-black uppercase text-slate-800 border-b-2 border-slate-100 pb-3 mb-5 italic'></h2>
                <div class='space-y-5 max-h-[60vh] overflow-y-auto pr-2'>
                    <div><p class='text-[9px] font-black text-slate-400 uppercase tracking-widest'>Cédula</p><p id='m-c' class='text-blue-800 font-black text-xl'></p></div>
                    <div><p class='text-[9px] font-black text-slate-400 uppercase tracking-widest'>Dirección / Domicilio</p><p id='m-d' class='text-slate-700 font-medium'></p></div>
                    <div><p class='text-[9px] font-black text-red-400 uppercase tracking-widest'>Antecedentes y Notas</p><div id='m-no' class='text-red-600 font-bold leading-tight text-sm whitespace-pre-wrap mt-1'></div></div>
                </div>
                <button onclick='cerrarModal()' class='mt-10 w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest'>CERRAR</button>
            </div>
        </div>
    </div>

    <script>
        const SB = 'https://pdoeklmwquxggppvigrf.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';
        let db = [];
        let offset = 0;
        let limit = 100;

        function entrar() {
            if (document.getElementById('pin-input').value === '3268') {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                
                const cache = localStorage.getItem('db_final_police');
                if(cache) {
                    db = JSON.parse(cache);
                    document.getElementById('count').innerText = db.length;
                    dibujar(db);
                    if(db.length < 1900) {
                        document.getElementById('sync-zone').classList.remove('hidden');
                        offset = db.length;
                    }
                } else {
                    document.getElementById('sync-zone').classList.remove('hidden');
                }
            } else { alert('PIN Incorrecto'); }
        }

        async function sincronizar() {
            const btn = document.getElementById('btn-sync');
            const prog = document.getElementById('prog');
            const bar = document.getElementById('bar');
            const stCount = document.getElementById('st-count');
            const stStatus = document.getElementById('st-status');
            btn.classList.add('hidden');
            prog.classList.remove('hidden');
            try {
                let more = true;
                while (more) {
                    const r = await fetch(SB + '/rest/v1/personas?select=*&order=nombre.asc&offset=' + offset + '&limit=' + limit, {
                        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
                    });
                    const d = await r.json();
                    if (d && d.length > 0) {
                        db = db.concat(d);
                        offset += limit;
                        stCount.innerText = 'CARGADO: ' + db.length + ' / ~1950';
                        bar.style.width = Math.min((db.length/1950)*100, 100) + '%';
                        document.getElementById('count').innerText = db.length;
                        dibujar(db);
                        localStorage.setItem('db_final_police', JSON.stringify(db));
                        if (d.length < limit) more = false;
                        await new Promise(res => setTimeout(res, 50));
                    } else { more = false; }
                }
                document.getElementById('sync-zone').classList.add('hidden');
            } catch (e) {
                btn.classList.remove('hidden');
            }
        }

        function dibujar(datos) {
            const lista = document.getElementById('lista');
            lista.innerHTML = datos.map(p => `
                <div onclick="verDetails('${p.id}')" class='bg-white p-5 rounded-2xl shadow-sm persona-card flex justify-between items-center cursor-pointer'>
                    <div class='overflow-hidden'>
                        <h3 class='font-bold uppercase text-slate-800 text-[11px] truncate'>${p.nombre || 'SIN NOMBRE'}</h3>
                        <p class='text-[10px] text-slate-400 font-bold uppercase'>CI: ${p.ci || '---'}</p>
                    </div>
                    <i class='fas fa-chevron-right text-slate-200 text-xs'></i>
                </div>`).join('');
        }

        function verDetails(id) {
            // Buscamos por ID único para evitar errores con CI
            const persona = db.find(x => String(x.id) === String(id));
            if(!persona) return;
            
            document.getElementById('m-n').innerText = persona.nombre || 'SIN NOMBRE';
            document.getElementById('m-c').innerText = persona.ci || '---';
            document.getElementById('m-d').innerText = persona.domicilio || persona.direccion || '---';
            
            // Unimos antecedentes y notas si existen
            let info = (persona.antecedentes ? 'ANTECEDENTES:\n' + persona.antecedentes + '\n\n' : '') + 
                       (persona.notas ? 'NOTAS:\n' + persona.notas : '');
            document.getElementById('m-no').innerText = info || 'S/N';
            
            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function filtrar() {
            const texto = document.getElementById('bus').value.toLowerCase().trim();
            if(!texto) { dibujar(db); return; }
            const filtrados = db.filter(p => 
                (p.nombre || '').toLowerCase().includes(texto) || 
                (p.ci || '').toString().includes(texto)
            );
            dibujar(filtrados);
        }

        function abrirForm() {
            alert('Función AGREGAR PERSONA: Se está restaurando el formulario original. Estará listo en la v35.0.');
        }

        function abrirVehiculo() {
            alert('Función AGREGAR MATRICULA: Se está restaurando el formulario original. Estará listo en la v35.0.');
        }
    </script>
</body>
</html>
