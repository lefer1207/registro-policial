<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Policial</title>
    <style>
        :root { --primary: #1a3a5c; --bg: #f0f2f5; --text: #2d3748; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* HEADER */
        header { background: var(--primary); color: white; padding: 1rem; text-align: left; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
        
        /* VISTAS */
        .view { display: none; padding-bottom: 80px; }
        .view.active { display: block; }

        /* LISTA */
        .search-container { padding: 1rem; background: var(--bg); position: sticky; top: 60px; z-index: 90; }
        #searchInput { width: 100%; padding: 12px; border: 2px solid #cbd5e0; border-radius: 25px; font-size: 16px; outline: none; box-sizing: border-box; }
        .container { padding: 0 1rem; display: grid; gap: 10px; }
        .card { background: white; border-radius: 12px; padding: 1rem; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .avatar-small { width: 45px; height: 45px; background: #2c5282; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; }

        /* DETALLE (IGUAL A LA FOTO) */
        .back-link { color: #d69e2e; text-decoration: none; display: block; padding: 1rem; font-weight: bold; cursor: pointer; }
        .profile-header { padding: 1rem; display: flex; align-items: center; gap: 1rem; }
        .avatar-large { width: 80px; height: 80px; background: #2c5282; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; }
        .section-title { background: #edf2f7; padding: 5px 1rem; color: #718096; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px; margin-top: 1rem; border-bottom: 1px solid #e2e8f0; }
        .data-row { padding: 1rem; background: white; display: flex; justify-content: space-between; border-bottom: 1px solid #f0f0f0; }
        .data-label { color: #a0aec0; }
        .notes-box { background: white; padding: 1rem; margin: 10px; border-radius: 10px; min-height: 50px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .actions { display: flex; gap: 10px; padding: 1rem; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-edit { background: white; border: 1px solid #cbd5e0; }
        .btn-delete { background: #e53e3e; color: white; }

        /* BOTÓN + */
        .fab { position: fixed; bottom: 85px; right: 20px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 101; }

        /* NAV INFERIOR */
        nav { position: fixed; bottom: 0; width: 100%; background: #1a3a5c; display: flex; justify-content: space-around; padding: 0.8rem 0; color: #a0aec0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; cursor: pointer; }
        .nav-item.active { color: #63b3ed; }

        /* FORMULARIO */
        .modal { position: fixed; top: 0; background: white; width: 100%; height: 100%; z-index: 200; display: none; flex-direction: column; }
        .modal-body { padding: 1rem; flex: 1; overflow-y: auto; }
        .modal input, .modal textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    </style>
</head>
<body>

<!-- LISTA PRINCIPAL -->
<div id="view-list" class="view active">
    <header>🛡️ Registro Policial</header>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar por nombre o CI..." oninput="filterData()">
    </div>
    <div class="container" id="personList"></div>
    <button class="fab" onclick="showForm()">+</button>
</div>

<!-- DETALLE (LA FICHA DE LA FOTO) -->
<div id="view-detail" class="view">
    <header>🛡️ Registro Policial</header>
    <div class="back-link" onclick="showView('view-list')">← Volver</div>
    <div id="detail-content"></div>
</div>

<!-- FORMULARIO AGREGAR/EDITAR -->
<div id="modal-form" class="modal">
    <header id="form-title">Nueva Persona</header>
    <div class="modal-body">
        <input type="text" id="f-nombre" placeholder="Nombre completo">
        <input type="number" id="f-ci" placeholder="Cédula de Identidad">
        <input type="text" id="f-tel" placeholder="Teléfono">
        <textarea id="f-notas" placeholder="Notas" rows="4"></textarea>
        <div class="actions">
            <button class="btn btn-edit" onclick="closeForm()">Cancelar</button>
            <button class="btn btn-delete" style="background:var(--primary)" onclick="savePerson()">Guardar</button>
        </div>
    </div>
</div>

<nav>
    <div class="nav-item active"><span>👤</span>Personas</div>
    <div class="nav-item"><span>🚗</span>Vehículos</div>
    <div class="nav-item"><span>🔍</span>Buscar</div>
</nav>
