<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro Policial</title>
  <style>
    :root {
      --primary: #1a3a5c; --secondary: #2c5f8a; --accent: #e8a020;
      --danger: #c0392b; --bg: #f0f2f5; --card: #ffffff;
      --text: #1a1a2e; --muted: #6c7a8d; --border: #d0d7e3;
      --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--primary); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .loader-overlay { position: fixed; inset: 0; background: rgba(26,58,92,0.18); z-index: 999; display: flex; align-items: center; justify-content: center; }
    .loader-overlay.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.88rem; z-index: 998; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); display: flex; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,0.15); }
    nav button { flex: 1; background: none; border: none; color: rgba(255,255,255,0.65); padding: 12px 4px 10px; font-size: 0.7rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    nav button.active { color: var(--accent); }
    nav button span.icon { font-size: 1.4rem; }
    main { padding: 16px 14px 80px; max-width: 600px; margin: 0 auto; }
    .view { display: none; } .view.active { display: block; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-bar input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 0.95rem; background: var(--card); }
    .btn { padding: 10px 18px; border: none; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--secondary); color: #fff; }
    .fab { position: fixed; bottom: 72px; right: 18px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.7rem; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; z-index: 99; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .detail-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--secondary); display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; }
    .detail-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .detail-notes { font-size: 0.9rem; background: #f7f9fc; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; padding: 8px 0; }
    .pagination button { background: var(--secondary); color: #fff; border: none; border-radius: 8px; padding: 7px 16px; cursor: pointer; }
    .pagination button:disabled { opacity: 0.4; }
  </style>
</head>
<body>
<div class="loader-overlay hidden" id="loader"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>
<header><h1>🛡️ Registro Policial</h1></header>
<nav>
  <button class="active" onclick="showTab('personas')" id="tab-personas"><span class="icon">👤</span>Personas</button>
  <button onclick="showTab('vehiculos')" id="tab-vehiculos"><span class="icon">🚗</span>Vehículos</button>
  <button onclick="showTab('buscar')" id="tab-buscar"><span class="icon">🔍</span>Buscar</button>
</nav>
<main>
  <div class="view active" id="view-personas">
    <div class="search-bar"><input type="search" id="searchPersonas" placeholder="Buscar..." oninput="buscarPersonas()"></div>
    <div id="listaPersonas"></div><div class="pagination" id="paginacionPersonas"></div>
  </div>
  <div class="view" id="view-vehiculos">
    <div class="search-bar"><input type="search" id="searchVehiculos" placeholder="Matrícula..." oninput="buscarVehiculos()"></div>
    <div id="listaVehiculos"></div><div class="pagination" id="paginacionVehiculos"></div>
  </div>
  <div class="view" id="view-buscar">
    <div class="search-bar"><input type="search" id="searchGlobal" placeholder="Buscar..." oninput="buscarGlobal()"></div>
    <div id="resultadosBusqueda"></div>
  </div>
  <div class="view" id="view-detalle-persona"><button class="btn" onclick="goBack()">← Volver</button><div id="detallePersonaContent"></div></div>
  <div class="view" id="view-detalle-vehiculo"><button class="btn" onclick="goBack()">← Volver</button><div id="detalleVehiculoContent"></div></div>
  <div class="view" id="view-form-persona">
    <button class="btn" onclick="goBack()">← Cancelar</button><h2>Persona</h2>
    <div class="form-group"><label>Foto</label><input type="file" accept="image/*" onchange="handlePhoto(event)"><div id="photoPreviewContainer"></div></div>
    <div class="form-group"><label>Nombre completo *</label><input type="text" id="fpNombre"></div>
    <div class="form-group"><label>Cédula</label><input type="text" id="fpCI"></div>
    <div class="form-group"><label>Fecha Nacimiento</label><input type="text" id="fpFechaNac" placeholder="DD/MM/YYYY"></div>
    <div class="form-group"><label>Domicilio</label><input type="text" id="fpDomicilio"></div>
    <div class="form-group"><label>Notas</label><textarea id="fpNotas"></textarea></div>
    <input type="hidden" id="fpId"><button class="btn btn-primary" onclick="guardarPersona()">Guardar</button>
  </div>
</main>
<button class="fab" id="fabBtn" onclick="onFabClick()">+</button>
<script>
// ============================================================
// CONFIGURACIÓN Y LÓGICA (EL CEREBRO DE LA APP)
// ============================================================
const SUPABASE_URL = 'https://pdoeklmwquxggppvigrf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';

const api = async (method, table, body, params) => {
  let url = `\({SUPABASE_URL}/rest/v1/\){table}${params?'?'+params:''}`;
  const res = await fetch(url, {
    method, headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer '+SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: body ? JSON.stringify(body) : null
  });
  return res.ok ? res.json() : [];
};
const sb = { get:(t,p)=>api('GET',t,null,p), patch:(t,b,p)=>api('PATCH',t,b,p), post:(t,b)=>api('POST',t,b), delete:(t,p)=>api('DELETE',t,null,p) };

let currentTab='personas', personasPage=0, vehiculosPage=0, PAGE_SIZE=30, viewStack=[], tempPhoto=null;

function showLoader(){ document.getElementById('loader').classList.remove('hidden'); document.getElementById('loader').style.display='flex'; }
function hideLoader(){ document.getElementById('loader').classList.add('hidden'); document.getElementById('loader').style.display='none'; }
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function iniciales(n){ return n?n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase():'??'; }
function formatFecha(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `\({d}/\){m}/${y}`; }

async function renderPersonas(q=''){
  showLoader(); const from=personasPage*PAGE_SIZE;
  let p=`select=id,nombre,ci,domicilio,foto&order=nombre.asc&limit=\({PAGE_SIZE}&offset=\){from}`;
  if(q) p+=`&or=(nombre.ilike.*\({encodeURIComponent(q)}*,ci.ilike.*\){encodeURIComponent(q)}*)`;
  const personas=await sb.get('personas',p);
  document.getElementById('listaPersonas').innerHTML=personas.map(p=>`
    <div class="card" onclick="verPersona('${p.id}')">
      <div class="avatar">\({p.foto?`<img src="\){p.foto}">`:iniciales(p.nombre)}</div>
      <div class="card-info"><b>\({p.nombre}</b><br><small>\){p.ci||''} • ${p.domicilio||''}</small></div>
    </div>`).join('');
  document.getElementById('paginacionPersonas').innerHTML=`<button onclick="personasPage=Math.max(0,personasPage-1);renderPersonas()" \({personasPage==0?'disabled':''}>Ant</button> <span>Pág. \){personasPage+1}</span> <button onclick="personasPage++;renderPersonas()" ${personas.length<PAGE_SIZE?'disabled':''}>Sig</button>`;
  hideLoader();
}

async function verPersona(id){
  showLoader(); const p=(await sb.get('personas',`id=eq.${id}`))[0];
  document.getElementById('view-detalle-persona').classList.add('active');
  document.getElementById('detallePersonaContent').innerHTML=`
    <div class="detail-header"><div class="detail-avatar">\({p.foto?`<img src="\){p.foto}">`:iniciales(p.nombre)}</div><div><h2>\({p.nombre}</h2><p>CI: \){p.ci||''}</p></div></div>
    <div class="detail-section"><h3>Datos</h3><p>Nacimiento: \({formatFecha(p.fecha_nac)}</p><p>Domicilio: \){p.domicilio||''}</p></div>
    <div class="detail-section"><h3>Notas</h3><div class="detail-notes">${p.notas||'Sin notas'}</div></div>
    <button class="btn btn-primary" onclick="editarPersona('${p.id}')">Editar</button>`;
  hideLoader();
}

async function guardarPersona(){
  const nombre=document.getElementById('fpNombre').value.trim(); if(!nombre) return showToast('Nombre requerido');
  showLoader(); const id=document.getElementById('fpId').value;
  const data={ nombre, ci:document.getElementById('fpCI').value, fecha_nac:document.getElementById('fpFechaNac').value||null, domicilio:document.getElementById('fpDomicilio').value, notas:document.getElementById('fpNotas').value, foto:tempPhoto };
  try{ if(id) await sb.patch('personas',data,`id=eq.${id}`); else await sb.post('personas',data); showToast('Guardado'); showTab('personas'); }
  catch(e){ showToast('Error'); } finally{ hideLoader(); }
}

function handlePhoto(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader(); reader.onload=ev=>{
    const img=new Image(); img.onload=()=>{
      const canvas=document.createElement('canvas'); const max=300; let w=img.width, h=img.height;
      if(w>max){h=h*(max/w);w=max;} if(h>max){w=w*(max/h);h=max;}
      canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
      tempPhoto=canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('photoPreviewContainer').innerHTML=`<img src="${tempPhoto}" style="width:80px;height:80px;object-fit:cover;border-radius:8px">`;
    }; img.src=ev.target.result;
  }; reader.readAsDataURL(file);
}

function showTab(t){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById('view-'+t).classList.add('active'); currentTab=t; if(t==='personas') renderPersonas(); }
function onFabClick(){ if(currentTab==='personas'){ document.getElementById('fpId').value=''; document.getElementById('view-form-persona').classList.add('active'); } }
function goBack(){ showTab(currentTab); }

renderPersonas();
</script>
</body>
</html>
