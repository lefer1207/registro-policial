<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro Policial Pro</title>
  <style>
    :root {
      --primary: #1a3a5c; --secondary: #2c5f8a; --accent: #e8a020; --danger: #c0392b;
      --bg: #f0f2f5; --card: #ffffff; --text: #1a1a2e; --muted: #6c7a8d;
      --border: #d0d7e3; --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
    header { background: var(--primary); color: #fff; padding: 14px 18px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); display: flex; z-index: 100; }
    nav button { flex: 1; background: none; border: none; color: rgba(255,255,255,0.65); padding: 12px 0; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    nav button.active { color: var(--accent); }
    main { padding: 16px 14px; max-width: 600px; margin: 0 auto; }
    .view { display: none; } .view.active { display: block; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-bar input { flex: 1; padding: 10px; border: 1.5px solid var(--border); border-radius: var(--radius); }
    .btn { padding: 10px 18px; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--secondary); color: #fff; }
    .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .fab { position: fixed; bottom: 72px; right: 18px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.7rem; box-shadow: 0 4px 14px rgba(0,0,0,0.25); z-index: 99; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { flex: 1; } .card-name { font-weight: 700; } .card-sub { font-size: 0.8rem; color: var(--muted); }
    .form-section { margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: var(--radius); }
    .photo-upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px; text-align: center; color: var(--muted); cursor: pointer; }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 20px; opacity: 0; transition: 0.3s; z-index: 999; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<header><h1>🛡️ Registro Policial Pro</h1></header>

<nav>
  <button class="active" onclick="showTab('personas')" id="tab-personas">👤 Personas</button>
  <button onclick="showTab('vehiculos')" id="tab-vehiculos">🚗 Vehículos</button>
  <button onclick="showTab('buscar')" id="tab-buscar">🔍 Buscar</button>
</nav>

<main>
  <!-- LISTADO PERSONAS -->
  <div class="view active" id="view-personas">
    <div class="search-bar"><input type="search" id="searchPersonas" placeholder="Buscar por nombre o CI..." oninput="renderPersonas()"></div>
    <div id="listaPersonas"></div>
  </div>

  <!-- FORMULARIO PERSONA -->
  <div class="view" id="view-form-persona">
    <button class="btn btn-ghost" onclick="goBack()" style="margin-bottom:15px;">← Volver</button>
    <div class="form-section">
      <h3>Foto</h3>
      <div class="photo-upload-area" onclick="document.getElementById('photoInput').click()">
        <div id="previewImg">📷<br>Agregar Foto</div>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">
    </div>
    <div class="form-section">
      <h3>Datos</h3>
      <div class="form-group"><label>Nombre *</label><input type="text" id="fpNombre"></div>
      <div class="form-group"><label>CI</label><input type="text" id="fpCI"></div>
      <div class="form-group"><label>Fecha de nacimiento</label><input type="text" id="fpFechaNac" placeholder="DD/MM/AAAA"></div>
      <div class="form-group"><label>Notas</label><textarea id="fpNotas"></textarea></div>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="guardarPersona()">Guardar Registro</button>
  </div>
</main>

<button class="fab" onclick="abrirFormPersona()">+</button>

<script>
// USAMOS LOCALSTORAGE PARA QUE NO SE TE PIERDAN LAS COSAS SI FALLA LA BASE DE DATOS
const DB = {
  get personas() { return JSON.parse(localStorage.getItem('rp_personas') || '[]'); },
  set personas(v) { localStorage.setItem('rp_personas', JSON.stringify(v)); }
};

function showTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
}

function abrirFormPersona() { showTab('form-persona'); }
function goBack() { showTab('personas'); }

function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }

let tempPhoto = null;
function handlePhoto(e) {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = (ev) => {
    tempPhoto = ev.target.result;
    document.getElementById('previewImg').innerHTML = `<img src="${tempPhoto}" style="width:80px;height:80px;border-radius:50%">`;
  };
  reader.readAsDataURL(file);
}

function guardarPersona() {
  const nombre = document.getElementById('fpNombre').value.trim();
  const rawFecha = document.getElementById('fpFechaNac').value.trim();
  if(!nombre) { showToast('Falta el nombre'); return; }

  // ARREGLO DE FECHA (Si ponés 31/10/1988, lo guarda bien)
  let fechaFinal = rawFecha;
  if(rawFecha.includes('/')) {
    const p = rawFecha.split('/');
    if(p.length === 3 && p[2].length === 4) fechaFinal = `\({p[2]}-\){p[1]}-${p[0]}`;
  }

  const nueva = {
    id: Date.now(),
    nombre,
    ci: document.getElementById('fpCI').value,
    fecha_nac: fechaFinal,
    notas: document.getElementById('fpNotas').value,
    foto: tempPhoto
  };

  const lista = DB.personas;
  lista.push(nueva);
  DB.personas = lista;

  showToast('¡Guardado!');
  document.getElementById('fpNombre').value = '';
  document.getElementById('fpFechaNac').value = '';
  tempPhoto = null;
  document.getElementById('previewImg').innerHTML = '📷<br>Agregar Foto';
  showTab('personas');
  renderPersonas();
}

function renderPersonas() {
  const q = document.getElementById('searchPersonas').value.toLowerCase();
  const lista = DB.personas.filter(p => p.nombre.toLowerCase().includes(q));
  document.getElementById('listaPersonas').innerHTML = lista.map(p => `
    <div class="card">
      <div class="avatar">\({p.foto ? `<img src="\){p.foto}">` : p.nombre[0]}</div>
      <div class="card-info">
        <div class="card-name">${p.nombre}</div>
        <div class="card-sub">\({p.ci || ''} • \){p.fecha_nac || ''}</div>
      </div>
    </div>
  `).join('');
}

renderPersonas();
</script>
</body>
</html>
