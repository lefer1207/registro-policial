<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro Policial</title>
<style>
body { font-family: Arial; background: #f0f2f5; margin: 0; }
header { background: #1a3a5c; color: #fff; padding: 16px 18px; font-size: 1.1rem; font-weight: 700; }
.fab { position: fixed; bottom: 80px; right: 18px; width: 56px; height: 56px; border-radius: 50%; background: #e8a020; color: #fff; border: none; font-size: 2rem; z-index: 9999; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
.panel { display: none; background: #fff; padding: 20px; margin: 20px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.panel.active { display: block; }
input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1.5px solid #d0d7e3; border-radius: 8px; font-size: 1rem; box-sizing: border-box; font-family: Arial; }
textarea { min-height: 80px; resize: vertical; }
.btn-save { background: #2c5f8a; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; width: 100%; margin-bottom: 8px; cursor: pointer; }
.btn-cancel { background: none; border: 1.5px solid #d0d7e3; padding: 12px; border-radius: 8px; font-size: 1rem; width: 100%; cursor: pointer; }
.card { background: #fff; padding: 14px 16px; margin: 0 14px 10px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.card strong { font-size: 0.97rem; }
.card small { color: #6c7a8d; font-size: 0.82rem; }
nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a3a5c; display: flex; padding: 10px 0; }
nav span { flex: 1; color: #e8a020; text-align: center; font-size: 0.75rem; }
#lista { padding: 14px 0 100px; }
.empty { text-align: center; color: #888; padding: 50px 20px; font-size: 0.95rem; }
</style>
</head>
<body>

<header>🛡️ Registro Policial</header>

<div id="lista"><div class="empty">Cargando...</div></div>

<div class="panel" id="formulario">
  <h3 style="margin-bottom:14px;color:#1a3a5c;">Nueva Persona</h3>
  <input type="text" id="nombre" placeholder="Nombre completo *">
  <input type="text" id="ci" placeholder="Cédula de identidad">
  <input type="text" id="domicilio" placeholder="Domicilio">
  <input type="tel" id="telefono" placeholder="Teléfono">
  <textarea id="notas" placeholder="Notas / Antecedentes"></textarea>
  <button class="btn-save" id="btnGuardar">Guardar</button>
  <button class="btn-cancel" id="btnCancelar">Cancelar</button>
</div>

<button class="fab" id="fab">+</button>

<nav><span>👤 Personas</span></nav>

<script>
var SURL = 'https://pdoeklmwquxggppvigrf.supabase.co';
var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';

document.getElementById('fab').addEventListener('click', abrirForm);
document.getElementById('btnCancelar').addEventListener('click', cerrarForm);
document.getElementById('btnGuardar').addEventListener('click', guardar);

function abrirForm() {
  document.getElementById('formulario').classList.add('active');
  document.getElementById('fab').style.display = 'none';
  document.getElementById('nombre').value = '';
  document.getElementById('ci').value = '';
  document.getElementById('domicilio').value = '';
  document.getElementById('telefono').value = '';
  document.getElementById('notas').value = '';
  window.scrollTo(0, 0);
}

function cerrarForm() {
  document.getElementById('formulario').classList.remove('active');
  document.getElementById('fab').style.display = 'block';
}

function guardar() {
  var nombre = document.getElementById('nombre').value.trim();
  if (!nombre) { alert('El nombre es obligatorio'); return; }
  var datos = {
    nombre: nombre,
    ci: document.getElementById('ci').value.trim() || null,
    domicilio: document.getElementById('domicilio').value.trim() || null,
    telefono: document.getElementById('telefono').value.trim() || null,
    notas: document.getElementById('notas').value.trim() || null
  };
  fetch(SURL + '/rest/v1/personas', {
    method: 'POST',
    headers: { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify(datos)
  }).then(function(res) {
    if (!res.ok) return res.text().then(function(t){ throw new Error(t); });
    return res.json();
  }).then(function() {
    cerrarForm();
    cargar();
  }).catch(function(e) { alert('Error al guardar: ' + e.message); });
}

function cargar() {
  fetch(SURL + '/rest/v1/personas?select=id,nombre,ci,domicilio&order=nombre.asc', {
    headers: { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY }
  }).then(function(res) { return res.json(); })
  .then(function(data) {
    var lista = document.getElementById('lista');
    if (!data.length) { lista.innerHTML = '<div class="empty">No hay personas registradas.<br>Tocá + para agregar.</div>'; return; }
    lista.innerHTML = data.map(function(p) {
      return '<div class="card"><strong>' + p.nombre + '</strong>' + (p.ci ? '<br><small>CI: ' + p.ci + '</small>' : '') + (p.domicilio ? '<br><small>' + p.domicilio + '</small>' : '') + '</div>';
    }).join('');
  }).catch(function(e) { document.getElementById('lista').innerHTML = '<div class="empty" style="color:red">Error de conexión:<br>' + e.message + '</div>'; });
}

cargar();
</script>
</body>
</html>
