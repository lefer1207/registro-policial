<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Registro Pro v18.0</title>
    <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-gray-100 min-h-screen'>
    <div id='pin-screen' class='fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6'>
        <h2 class='text-2xl font-bold mb-6 text-gray-800'>Acceso Seguro</h2>
        <input type='password' id='pin-input' placeholder='PIN' class='border-2 border-gray-300 p-4 rounded-xl w-full max-w-xs text-center text-2xl mb-4 outline-none'>
        <button onclick='verificarPIN()' class='bg-blue-600 text-white px-8 py-4 rounded-xl font-bold w-full max-w-xs shadow-lg'>ENTRAR</button>
        <p class='mt-10 text-gray-400 text-xs'>v18.0 (Diagnóstico)</p>
    </div>

    <div id='app' class='hidden'>
        <header class='bg-gray-800 text-white p-4 sticky top-0 shadow-md z-30'>
            <h1 class='text-lg font-bold'>Registro Policial Pro</h1>
            <input type='text' id='buscador' oninput='filtrar()' placeholder='🔎 Buscar...' class='w-full mt-2 p-3 rounded text-black outline-none'>
        </header>
        <main class='p-4'>
            <div id='status' class='text-center py-6 bg-white rounded-lg shadow mb-4'>
                <p id='status-text' class='text-gray-700 font-bold text-lg'>⌛ Preparando...</p>
                <button id='btn-cargar' onclick='cargarDatos()' class='mt-4 bg-blue-600 text-white px-6 py-3 rounded-lg font-bold text-lg shadow hidden'>
                    👆 TOCAR PARA CARGAR
                </button>
                <p id='count-text' class='text-xs text-gray-500 mt-2'></p>
            </div>
            <div id='contenedor-personas' class='space-y-3 pb-20'></div>
        </main>
    </div>

    <script>
        const SB = 'https://pdoeklmwquxggppvigrf.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';
        let db = [];

        function verificarPIN() {
            if (document.getElementById('pin-input').value === '3268') {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                // Mostrar botón grande inmediatamente - SIN carga automática
                document.getElementById('status-text').innerHTML = '👇 Toque el botón para cargar';
                document.getElementById('btn-cargar').classList.remove('hidden');
            } else { alert('PIN Incorrecto'); }
        }

        async function cargarDatos() {
            const statusText = document.getElementById('status-text');
            const btn = document.getElementById('btn-cargar');
            const countText = document.getElementById('count-text');
            
            btn.style.display = 'none';
            statusText.innerHTML = '⏳ Conectando con servidor...';
            countText.innerHTML = '';

            try {
                // Pedimos solo los primeros 50 para ver si entra ALGO
                const res = await fetch(SB + '/rest/v1/personas?select=nombre,ci&order=nombre.asc&limit=50', {
                    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
                });
                
                if (!res.ok) {
                    statusText.innerHTML = '❌ Error del servidor (' + res.status + ')';
                    btn.classList.remove('hidden');
                    return;
                }
                
                db = await res.json();
                countText.innerHTML = '✅ Recibidos: ' + db.length;
                
                if (db.length === 0) {
                    statusText.innerHTML = '⚠️ Base de datos vacía';
                    return;
                }
                
                // Si llegaron, pedir más
                statusText.innerHTML = '⏳ Cargando más registros...';
                let offset = 50;
                let limit = 200;
                let hasMore = true;
                
                while (hasMore) {
                    const r2 = await fetch(SB + '/rest/v1/personas?select=nombre,ci&order=nombre.asc&offset=' + offset + '&limit=' + limit, {
                        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
                    });
                    const d2 = await r2.json();
                    if (d2 && d2.length > 0) {
                        db = db.concat(d2);
                        offset += limit;
                        countText.innerHTML = '✅ Cargados: ' + db.length;
                        dibujar(db);
                        if (d2.length < limit) hasMore = false;
                    } else { hasMore = false; }
                }
                
                statusText.innerHTML = '✅ Listo! Total: ' + db.length;
                setTimeout(() => { document.getElementById('status').style.display = 'none'; }, 1500);
                
            } catch (err) {
                console.error(err);
                statusText.innerHTML = '❌ Sin conexión. Use DATOS MÓVILES (no Wi-Fi)';
                btn.classList.remove('hidden');
            }
        }

        function dibujar(datos) {
            document.getElementById('contenedor-personas').innerHTML = datos.map(p => `
                <div class='bg-white p-4 rounded shadow border-l-4 border-gray-500'>
                    <h3 class='font-bold uppercase text-gray-800'>${p.nombre || 'Sin nombre'}</h3>
                    <p class='text-sm text-gray-600'>CI: ${p.ci || 'S/D'}</p>
                </div>`).join('');
        }

        function filtrar() {
            const txt = document.getElementById('buscador').value.toLowerCase().trim();
            if (!txt) { dibujar(db); return; }
            dibujar(db.filter(p => (p.nombre || '').toLowerCase().includes(txt) || (p.ci || '').toString().includes(txt)));
        }
    </script>
</body>
</html>
