<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro Policial v4</title>
  <style>
    :root {
      --primary: #1a3a5c;
      --secondary: #2c5f8a;
      --accent: #e8a020;
      --danger: #c0392b;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6c7a8d;
      --border: #d0d7e3;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--primary); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .loader-overlay { position: fixed; inset: 0; background: rgba(26,58,92,0.18); z-index: 999; display: flex; align-items: center; justify-content: center; }
    .loader-overlay.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.88rem; z-index: 998; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); display: flex; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,0.15); }
    nav button { flex: 1; background: none; border: none; color: rgba(255,255,255,0.65); padding: 12px 4px 10px; font-size: 0.7rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.2s; }
    nav button.active { color: var(--accent); }
    nav button span.icon { font-size: 1.4rem; }
    main { padding: 16px 14px 80px; max-width: 600px; margin: 0 auto; }
    .view { display: none; }
    .view.active { display: block; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-bar input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 0.95rem; background: var(--card); color: var(--text); }
    .btn { padding: 10px 18px; border: none; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary { background: var(--secondary); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .fab { position: fixed; bottom: 72px; right: 18px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.7rem; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; z-index: 99; transition: transform 0.2s; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-weight: 700; font-size: 0.97rem; }
    .card-sub { font-size: 0.8rem; color: var(--muted); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 0.93rem; }
    .photo-upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px; text-align: center; cursor: pointer; color: var(--muted); margin-bottom: 10px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--card); border-radius: 18px 18px 0 0; padding: 20px 16px 30px; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
  </style>
</head>
<body>

<div class="loader-overlay hidden" id="loader"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<header><h1>🛡️ Registro Policial Pro</h1></header>

<nav>
  <button class="active" onclick="showTab('personas')" id="tab-personas"><span class="icon">👤</span>Personas</button>
  <button onclick="showTab('vehiculos')" id="tab-vehiculos"><span class="icon">🚗</span>Vehículos</button>
  <button onclick="showTab('buscar')" id="tab-buscar"><span class="icon">🔍</span>Buscar</button>
</nav>

<main>
  <div class="view active" id="view-personas">
    <div class="search-bar"><input type="search" id="searchPersonas" placeholder="Buscar..." oninput="buscarPersonas()"></div>
    <div id="listaPersonas"></div>
  </div>

  <div class="view" id="view-vehiculos">
    <div class="search-bar"><input type="search" id="searchVehiculos" placeholder="Buscar..." oninput="buscarVehiculos()"></div>
    <div id="listaVehiculos"></div>
  </div>

  <div class="view" id="view-form-persona">
    <div class="form-section">
      <h3>Datos Personales</h3>
      <div class="form-group"><label>Nombre completo *</label><input type="text" id="fpNombre"></div>
      <div class="form-group"><label>Cédula de Identidad</label><input type="text" id="fpCI"></div>
      <div class="form-group"><label>Fecha de nacimiento</label><input type="text" id="fpFechaNac" placeholder="DD/MM/AAAA"></div>
      <div class="form-group"><label>Domicilio</label><input type="text" id="fpDomicilio"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="goBack()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarPersona()">Guardar</button>
      </div>
    </div>
  </div>
</main>

<button class="fab" onclick="abrirFormPersona()">+</button>

<script>
const SUPABASE_URL = 'https://pdoeklmwquxggppvigrf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dgzsdZ2CCSet9y4FJ9QmrQ_RQKwqJXe';

const sb = {
  get: async (table, params) => {
    const res = await fetch(`\({SUPABASE_URL}/rest/v1/\){table}?${params}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    return res.json();
  },
  post: async (table, body) => {
    const res = await fetch(`\({SUPABASE_URL}/rest/v1/\){table}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify(body)
    });
    return res.json();
  }
};

function showLoader() { document.getElementById('loader').classList.remove('hidden'); }
function hideLoader() { document.getElementById('loader').classList.add('hidden'); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

async function guardarPersona() {
  const nombre = document.getElementById('fpNombre').value.trim();
  if (!nombre) { showToast('Nombre obligatorio'); return; }
  
  showLoader();
  try {
    const rawFecha = document.getElementById('fpFechaNac').value.trim();
    let fechaNac = rawFecha;

    // CONVERSIÓN DE FECHA MÁGICA
    if (rawFecha.includes('/')) {
      const parts = rawFecha.split('/');
      if (parts.length === 3) {
        // Si viene DD/MM/AAAA -> AAAA-MM-DD
        if (parts[2].length === 4) fechaNac = `\({parts[2]}-\){parts[1]}-${parts[0]}`;
      }
    }

    const data = {
      nombre,
      ci: document.getElementById('fpCI').value.trim() || null,
      fecha_nac: fechaNac || null,
      domicilio: document.getElementById('fpDomicilio').value.trim() || null
    };

    await sb.post('personas', data);
    showToast('Guardado correctamente');
    showTab('personas');
  } catch (e) {
    showToast('Error al guardar');
    console.error(e);
  } finally {
    hideLoader();
  }
}

function showTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
}
function abrirFormPersona() {
  showTab('form-persona');
}
function goBack() { showTab('personas'); }
</script>
</body>
</html>
