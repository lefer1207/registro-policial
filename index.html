<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro Policial</title>
  <style>
    :root { --primary: #1a3a5c; --secondary: #2c5f8a; --accent: #e8a020; --danger: #c0392b; --bg: #f0f2f5; --card: #ffffff; --text: #1a1a2e; --muted: #6c7a8d; --border: #d0d7e3; --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.10); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--primary); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .loader-overlay { position: fixed; inset: 0; background: rgba(26,58,92,0.18); z-index: 999; display: flex; align-items: center; justify-content: center; }
    .loader-overlay.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.88rem; z-index: 998; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); display: flex; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,0.15); }
    nav button { flex: 1; background: none; border: none; color: rgba(255,255,255,0.65); padding: 12px 0; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
    nav button.active { color: var(--accent); }
    main { padding: 16px 14px 80px; max-width: 600px; margin: 0 auto; }
    .view { display: none; } .view.active { display: block; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { flex: 1; } .card-name { font-weight: 700; } .card-sub { font-size: 0.8rem; color: var(--muted); }
    .fab { position: fixed; bottom: 72px; right: 18px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.7rem; box-shadow: 0 4px 14px rgba(0,0,0,0.25); z-index: 99; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: var(--radius); }
    .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    .pagination button { padding: 6px 14px; background: var(--secondary); color: white; border: none; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    .pagination button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
<div class="loader-overlay hidden" id="loader"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>
<header><h1>🛡️ Registro Policial Pro</h1></header>
<nav>
  <button class="active" onclick="showTab('personas')">👤 Personas</button>
  <button onclick="showTab('vehiculos')">🚗 Vehículos</button>
  <button onclick="showTab('buscar')">🔍 Buscar</button>
</nav>
<main>
  <div class="view active" id="view-personas">
    <div class="search-bar"><input type="search" id="searchPersonas" placeholder="Buscar por nombre o CI..." oninput="buscarPersonas()" style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;"></div>
    <div id="listaPersonas"></div>
    <div class="pagination" id="paginacionPersonas"></div>
  </div>
  <!-- El resto del sistema (Vínculos, Vehículos, etc) se carga con la llave correcta abajo -->
</main>
<button class="fab" onclick="showTab('form-persona')">+</button>

<script>
// USAMOS TU LLAVE LARGA ORIGINAL PARA QUE VUELVAN LOS 1910 REGISTROS
const SUPABASE_URL = 'https://pdoeklmwquxggppvigrf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';

const sb = {
  get: async (table, params) => {
    const res = await fetch(`\({SUPABASE_URL}/rest/v1/\){table}?${params}`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
    return res.json();
  },
  post: async (table, body) => {
    const res = await fetch(`\({SUPABASE_URL}/rest/v1/\){table}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify(body)
    });
    return res.json();
  }
};

let personasPage = 0;
const PAGE_SIZE = 30;

function showLoader() { document.getElementById('loader').classList.remove('hidden'); }
function hideLoader() { document.getElementById('loader').classList.add('hidden'); }
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }

async function renderPersonas(q='') {
  showLoader();
  try {
    const from = personasPage * PAGE_SIZE;
    let params = `select=id,nombre,ci,domicilio,foto&order=nombre.asc&limit=\({PAGE_SIZE}&offset=\){from}`;
    if (q) params += `&or=(nombre.ilike.*\({q}*,ci.ilike.*\){q}*)`;
    const personas = await sb.get('personas', params);
    
    document.getElementById('listaPersonas').innerHTML = personas.map(p => `
      <div class="card" onclick="alert('CI: ${p.ci||'Sin dato'}')">
        <div class="avatar">\({p.foto ? `<img src="\){p.foto}">` : p.nombre[0]}</div>
        <div class="card-info"><b>\({p.nombre}</b><br><small>\){p.ci || ''} • ${p.domicilio || ''}</small></div>
      </div>`).join('');
    
    document.getElementById('paginacionPersonas').innerHTML = `
      <button onclick="cambiarPagina(-1)" ${personasPage===0?'disabled':''}>Anterior</button>
      <span>Pág. ${personasPage+1}</span>
      <button onclick="cambiarPagina(1)" ${personas.length<PAGE_SIZE?'disabled':''}>Siguiente</button>`;
  } finally { hideLoader(); }
}

function cambiarPagina(d) { personasPage += d; renderPersonas(); }
function buscarPersonas() { personasPage=0; renderPersonas(document.getElementById('searchPersonas').value); }
function showTab(t) { document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); if(document.getElementById('view-'+t)) document.getElementById('view-'+t).classList.add('active'); }

renderPersonas();
</script>
</body>
</html>
