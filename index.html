<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Registro Policial Pro</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css'>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f1f5f9; }
        .bg-header { background-color: #1e293b; }
        .bg-btn-persona { background-color: #1e3a8a; }
        .bg-btn-matricula { background-color: #334155; }
        .persona-card { border-left: 6px solid #1e3a8a; }
        input, textarea, select { border: 1px solid #e2e8f0 !important; }
        .view { display: none; }
        .view.active { display: flex; }
    </style>
</head>
<body class='bg-slate-100'>
    <!-- PANTALLA PIN -->
    <div id='pin-screen' class='fixed inset-0 bg-header z-[100] flex flex-col items-center justify-center p-6 text-white text-center'>
        <i class='fas fa-shield-halved text-6xl mb-4 text-blue-400'></i>
        <h2 class='text-2xl font-bold mb-1 uppercase tracking-tighter'>Registro Policial Pro</h2>
        <p class='text-slate-500 mb-8 text-[10px]'>v36.0 - FIX BOTÓN MATRICULA</p>
        <input type='password' id='pin-input' placeholder='PIN' class='border-none p-4 rounded-2xl w-full max-w-xs text-center text-2xl mb-4 bg-slate-800 text-white outline-none'>
        <button onclick='entrar()' class='bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold w-full max-w-xs shadow-lg active:scale-95'>INGRESAR</button>
    </div>

    <!-- APP PRINCIPAL -->
    <div id='app' class='hidden flex flex-col min-h-screen'>
        <!-- HEADER -->
        <header class='bg-header text-white p-4 sticky top-0 shadow-2xl z-40'>
            <div class='flex justify-between items-center mb-4'>
                <h1 class='text-lg font-bold flex items-center'><i class='fas fa-id-badge mr-2'></i>REGISTRO</h1>
                <span id='count' class='bg-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold'>0</span>
            </div>
            <div class='relative'>
                <i class='fas fa-search absolute left-4 top-3.5 text-slate-400'></i>
                <input type='text' id='bus' oninput='filtrar()' placeholder='Buscar nombre o cédula...' class='w-full p-3 pl-12 rounded-2xl text-black outline-none border-none bg-white text-sm shadow-inner'>
            </div>
        </header>

        <!-- VISTA LISTADO -->
        <main id='view-list' class='view active flex-col p-4'>
            <div class='grid grid-cols-2 gap-4 mb-6'>
                <button onclick='abrirForm()' class='bg-btn-persona text-white p-5 rounded-2xl text-[10px] font-bold shadow-md flex flex-col items-center uppercase tracking-tighter'>
                    <i class='fas fa-user-plus text-2xl mb-2'></i>AGREGAR PERSONA
                </button>
                <button onclick='abrirMatricula()' class='bg-btn-matricula text-white p-5 rounded-2xl text-[10px] font-bold shadow-md flex flex-col items-center uppercase tracking-tighter'>
                    <i class='fas fa-car text-2xl mb-2'></i>AGREGAR MATRICULA
                </button>
            </div>
            <div id='sync-zone' class='hidden bg-white p-6 rounded-3xl shadow-sm border-2 border-dashed border-blue-200 text-center mb-6'>
                <p id='st-status' class='text-blue-600 font-bold text-sm mb-4 uppercase italic'>Sincronizando...</p>
                <button onclick='sincronizar()' id='btn-sync' class='w-full bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-xl'>CARGAR DATOS</button>
                <div id='prog' class='mt-4 hidden'><div class='w-full bg-slate-100 rounded-full h-2 overflow-hidden'><div id='bar' class='bg-blue-600 h-full' style='width:0%'></div></div></div>
            </div>
            <div id='lista' class='grid gap-3 pb-24'></div>
        </main>

        <!-- VISTA FORMULARIO PERSONA -->
        <main id='view-form' class='view flex-col p-4 bg-white min-h-screen hidden'>
            <div class='flex items-center mb-6 text-slate-800' onclick='irA("view-list")'>
                <i class='fas fa-arrow-left mr-3'></i><span class='font-bold uppercase tracking-widest text-xs'>Volver al listado</span>
            </div>
            <h2 id='form-title' class='text-xl font-black text-slate-900 mb-6 border-b pb-2 uppercase italic'>Nuevo Registro</h2>
            <div class='space-y-4 pb-10'>
                <div id='field-nombre'><label class='text-[10px] font-bold text-slate-400 uppercase'>Nombre completo *</label><input type='text' id='f-nombre' class='w-full p-4 rounded-xl bg-slate-50 outline-none'></div>
                <div id='field-ci'><label class='text-[10px] font-bold text-slate-400 uppercase'>Cédula de Identidad</label><input type='text' id='f-ci' class='w-full p-4 rounded-xl bg-slate-50 outline-none'></div>
                <div><label class='text-[10px] font-bold text-slate-400 uppercase'>Domicilio</label><input type='text' id='f-domicilio' class='w-full p-4 rounded-xl bg-slate-50 outline-none'></div>
                <div><label class='text-[10px] font-bold text-slate-400 uppercase'>Teléfono</label><input type='text' id='f-tel' class='w-full p-4 rounded-xl bg-slate-50 outline-none'></div>
                <div><label class='text-[10px] font-bold text-slate-400 uppercase'>Vehículo / Matrícula</label><input type='text' id='f-veh' class='w-full p-4 rounded-xl bg-slate-50 outline-none'></div>
                <div><label class='text-[10px] font-bold text-slate-400 uppercase text-red-500'>Antecedentes / Notas</label><textarea id='f-notas' rows='5' class='w-full p-4 rounded-xl bg-slate-50 outline-none border-red-100'></textarea></div>
                <button onclick='guardarRegistro()' class='w-full bg-blue-700 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all mt-4'>💾 GUARDAR</button>
            </div>
        </main>

        <!-- MODAL DETALLES -->
        <div id='modal' class='fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4' onclick='cerrarModal()'>
            <div class='bg-white w-full max-w-md rounded-3xl p-8 relative' onclick='event.stopPropagation()'>
                <h2 id='m-n' class='text-xl font-black uppercase text-slate-800 border-b-2 border-slate-100 pb-3 mb-5 italic'></h2>
                <div class='space-y-5 max-h-[60vh] overflow-y-auto'>
                    <div><p class='text-[9px] font-black text-slate-400 uppercase'>Cédula</p><p id='m-c' class='text-blue-800 font-black text-xl'></p></div>
                    <div><p class='text-[9px] font-black text-slate-400 uppercase'>Domicilio</p><p id='m-d' class='text-slate-700 font-medium'></p></div>
                    <div><p class='text-[9px] font-black text-red-400 uppercase'>Notas/Antecedentes</p><div id='m-no' class='text-red-600 font-bold leading-tight text-sm whitespace-pre-wrap mt-1'></div></div>
                </div>
                <button onclick='cerrarModal()' class='mt-10 w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest'>CERRAR</button>
            </div>
        </div>
    </div>

    <script>
        const SB = 'https://pdoeklmwquxggppvigrf.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';
        let db = [];
        let modoMatricula = false;

        function entrar() {
            if (document.getElementById('pin-input').value === '3268') {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                const cache = localStorage.getItem('db_final_police');
                if(cache) {
                    db = JSON.parse(cache);
                    document.getElementById('count').innerText = db.length;
                    dibujar(db);
                }
            } else { alert('PIN Incorrecto'); }
        }

        function irA(id) {
            document.querySelectorAll('.view').forEach(v => { v.classList.add('hidden'); v.classList.remove('active'); });
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function abrirForm() {
            modoMatricula = false;
            document.getElementById('form-title').innerText = 'Nuevo Registro';
            document.getElementById('field-nombre').classList.remove('hidden');
            document.getElementById('field-ci').classList.remove('hidden');
            irA('view-form');
        }

        function abrirMatricula() {
            modoMatricula = true;
            document.getElementById('form-title').innerText = 'Agregar Matrícula';
            document.getElementById('field-nombre').classList.add('hidden');
            document.getElementById('field-ci').classList.add('hidden');
            irA('view-form');
        }

        async function guardarRegistro() {
            const nom = document.getElementById('f-nombre').value;
            const ci = document.getElementById('f-ci').value;
            const veh = document.getElementById('f-veh').value;
            
            if(!modoMatricula && !nom) { alert('Nombre es obligatorio'); return; }
            if(modoMatricula && !veh) { alert('Matrícula es obligatoria'); return; }
            
            const data = { 
                nombre: modoMatricula ? 'MATRÍCULA AISLADA' : nom, 
                ci: ci, 
                domicilio: document.getElementById('f-domicilio').value, 
                telefono: document.getElementById('f-tel').value, 
                vehiculo1: veh, 
                notas: document.getElementById('f-notas').value 
            };
            
            try {
                const r = await fetch(SB + '/rest/v1/personas', {
                    method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                    body: JSON.stringify(data)
                });
                if(r.ok) {
                    alert('¡Guardado con Éxito!');
                    db.unshift(data);
                    localStorage.setItem('db_final_police', JSON.stringify(db));
                    dibujar(db);
                    irA('view-list');
                    // Limpiar campos
                    ['f-nombre','f-ci','f-domicilio','f-tel','f-veh','f-notas'].forEach(id => document.getElementById(id).value = '');
                }
            } catch(e) { alert('Error al guardar'); }
        }

        function dibujar(datos) {
            const lista = document.getElementById('lista');
            lista.innerHTML = datos.map(p => `
                <div onclick="verDetails('${p.id || p.ci || p.vehiculo1}')" class='bg-white p-5 rounded-2xl shadow-sm persona-card flex justify-between items-center cursor-pointer'>
                    <div class='overflow-hidden'>
                        <h3 class='font-bold uppercase text-slate-800 text-[11px] truncate'>${p.nombre || 'SIN NOMBRE'}</h3>
                        <p class='text-[10px] text-slate-400 font-bold uppercase'>${p.ci ? 'CI: '+p.ci : (p.vehiculo1 ? 'MAT: '+p.vehiculo1 : '---')}</p>
                    </div>
                    <i class='fas fa-chevron-right text-slate-200 text-xs'></i>
                </div>`).join('');
        }

        function verDetails(id) {
            const p = db.find(x => String(x.id || x.ci || x.vehiculo1) === String(id));
            if(!p) return;
            document.getElementById('m-n').innerText = p.nombre || 'SIN NOMBRE';
            document.getElementById('m-c').innerText = p.ci || '---';
            document.getElementById('m-d').innerText = p.domicilio || p.direccion || '---';
            document.getElementById('m-no').innerText = (p.antecedentes ? 'ANTECEDENTES:\n'+p.antecedentes+'\n\n' : '') + (p.notas || '');
            document.getElementById('modal').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }

        function filtrar() {
            const t = document.getElementById('bus').value.toLowerCase().trim();
            if(!t) { dibujar(db); return; }
            dibujar(db.filter(p => (p.nombre||'').toLowerCase().includes(t) || (p.ci||'').toString().includes(t) || (p.vehiculo1||'').toLowerCase().includes(t)));
        }
    </script>
</body>
</html>
