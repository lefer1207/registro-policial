<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <meta http-equiv='cache-control' content='no-cache, must-revalidate, post-check=0, pre-check=0'>
    <meta http-equiv='expires' content='0'>
    <meta http-equiv='pragma' content='no-cache'>
    <title>REGISTRO V38</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css'>
</head>
<body class='bg-slate-900 text-white'>
    <div id='pin-screen' class='fixed inset-0 flex flex-col items-center justify-center p-6 text-center z-[200] bg-slate-900'>
        <h1 class='text-6xl font-black text-blue-500 mb-2'>v38.0</h1>
        <p class='text-slate-400 mb-8 uppercase tracking-widest text-xs font-bold'>Actualización Obligatoria</p>
        
        <div class='bg-slate-800 p-8 rounded-3xl w-full max-w-xs shadow-2xl border border-slate-700'>
            <input type='password' id='pin-input' placeholder='INGRESE PIN' class='w-full p-4 rounded-2xl text-center text-2xl mb-4 bg-slate-900 text-white border border-slate-600 outline-none focus:border-blue-500'>
            <button onclick='entrar()' class='w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-black text-lg transition-all active:scale-95'>INGRESAR</button>
        </div>

        <button onclick='resetApp()' class='mt-12 text-blue-400 text-[10px] font-bold uppercase tracking-widest border border-blue-400/30 px-4 py-2 rounded-full'>
            <i class='fas fa-sync-alt mr-2'></i> SI NO VES EL V38 TOCA AQUÍ
        </button>
    </div>

    <div id='app' class='hidden bg-slate-50 text-slate-900 min-h-screen'>
        <header class='bg-slate-800 text-white p-4 sticky top-0 z-50 shadow-xl'>
            <div class='flex justify-between items-center mb-4'>
                <h1 class='font-black italic'>REGISTRO POLICIAL <span class='text-blue-400 text-[10px]'>v38.0</span></h1>
                <div id='count' class='bg-blue-600 px-3 py-1 rounded-full text-[10px] font-bold shadow-lg'>0</div>
            </div>
            <div class='relative'>
                <i class='fas fa-search absolute left-4 top-3.5 text-slate-500'></i>
                <input type='text' id='bus' oninput='filtrar()' placeholder='BUSCAR NOMBRE, CI O MATRICULA...' class='w-full p-3 pl-12 rounded-xl bg-white text-slate-900 text-sm outline-none shadow-inner font-bold'>
            </div>
        </header>

        <main class='p-4'>
            <div class='grid grid-cols-2 gap-3 mb-6'>
                <button onclick='abrirF(false)' class='bg-blue-800 text-white p-4 rounded-2xl shadow-lg flex flex-col items-center justify-center active:scale-95'>
                    <i class='fas fa-user-plus text-xl mb-1'></i>
                    <span class='text-[9px] font-black uppercase'>AGREGAR PERSONA</span>
                </button>
                <button onclick='abrirF(true)' class='bg-slate-600 text-white p-4 rounded-2xl shadow-lg flex flex-col items-center justify-center active:scale-95'>
                    <i class='fas fa-car text-xl mb-1'></i>
                    <span class='text-[9px] font-black uppercase'>AGREGAR MATRICULA</span>
                </button>
            </div>
            <div id='lista' class='grid gap-2 pb-24'></div>
        </main>

        <!-- FORMULARIO -->
        <div id='form-view' class='fixed inset-0 bg-white z-[150] hidden flex flex-col p-4 overflow-y-auto'>
            <div onclick='cerrarF()' class='mb-6 flex items-center font-black text-xs uppercase text-slate-500 cursor-pointer'>
                <i class='fas fa-arrow-left mr-2'></i> VOLVER
            </div>
            <h2 id='f-t' class='text-2xl font-black uppercase italic mb-6 border-b-4 border-slate-900 pb-2 text-slate-900'></h2>
            <div class='space-y-4'>
                <div id='f-n-c'><label class='text-[10px] font-black text-slate-400 uppercase'>Nombre Completo *</label><input id='in-n' type='text' class='w-full p-4 rounded-xl bg-slate-100 border-none outline-none font-bold'></div>
                <div id='f-c-c'><label class='text-[10px] font-black text-slate-400 uppercase'>Cédula</label><input id='in-c' type='text' class='w-full p-4 rounded-xl bg-slate-100 border-none outline-none font-bold'></div>
                <div><label class='text-[10px] font-black text-slate-400 uppercase'>Domicilio</label><input id='in-d' type='text' class='w-full p-4 rounded-xl bg-slate-100 border-none outline-none font-bold'></div>
                <div><label class='text-[10px] font-black text-slate-400 uppercase'>Teléfono</label><input id='in-t' type='text' class='w-full p-4 rounded-xl bg-slate-100 border-none outline-none font-bold'></div>
                <div><label class='text-[10px] font-black text-slate-400 uppercase'>Matrícula</label><input id='in-v' type='text' class='w-full p-4 rounded-xl bg-slate-100 border-none outline-none font-bold'></div>
                <div><label class='text-[10px] font-black text-red-500 uppercase italic'>Antecedentes / Notas</label><textarea id='in-no' rows='5' class='w-full p-4 rounded-xl bg-red-50 border-2 border-red-100 outline-none font-bold text-red-900 text-sm'></textarea></div>
                <button onclick='save()' class='w-full bg-blue-700 text-white py-5 rounded-2xl font-black uppercase shadow-2xl active:scale-95'>GUARDAR REGISTRO</button>
            </div>
        </div>

        <!-- DETALLES -->
        <div id='det-view' class='fixed inset-0 bg-black/95 z-[160] hidden flex items-center justify-center p-4' onclick='this.classList.add("hidden")'>
            <div class='bg-white w-full max-w-md rounded-[40px] p-8 shadow-2xl' onclick='event.stopPropagation()'>
                <h2 id='d-n' class='text-2xl font-black uppercase italic text-slate-900 border-b-2 border-slate-100 pb-4 mb-6 leading-tight'></h2>
                <div class='space-y-6 max-h-[50vh] overflow-y-auto pr-2'>
                    <div><p class='text-[10px] font-black text-slate-400 uppercase'>Cédula de Identidad</p><p id='d-c' class='text-blue-700 font-black text-2xl tracking-tighter'></p></div>
                    <div><p class='text-[10px] font-black text-slate-400 uppercase'>Dirección / Domicilio</p><p id='d-d' class='text-slate-800 font-bold text-lg leading-tight'></p></div>
                    <div><p class='text-[10px] font-black text-red-500 uppercase italic'>Notas Policiales</p><div id='d-no' class='text-red-700 font-black leading-tight text-sm whitespace-pre-wrap bg-red-50 p-4 rounded-2xl border border-red-100 mt-2'></div></div>
                </div>
                <button onclick='document.getElementById("det-view").classList.add("hidden")' class='mt-10 w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase'>CERRAR</button>
            </div>
        </div>
    </div>

    <script>
        const SB = 'https://pdoeklmwquxggppvigrf.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2VrbG13cXV4Z2dwcHZpZ3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc1NzIsImV4cCI6MjA5NTU3MzU3Mn0.VDVsGgC3b00tJHWkiyPze9wGrqMVQAbKeMxBvMsHQRM';
        let db = [];
        let isMat = false;

        function resetApp() { localStorage.clear(); location.href = location.href + '?v=' + Date.now(); }

        function entrar() {
            if (document.getElementById('pin-input').value === '3268') {
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                const cache = localStorage.getItem('db_final_police');
                if(cache) {
                    db = JSON.parse(cache);
                    document.getElementById('count').innerText = db.length;
                    draw(db);
                } else { resetApp(); }
            } else { alert('PIN INCORRECTO'); }
        }

        function abrirF(m) {
            isMat = m;
            document.getElementById('f-t').innerText = m ? 'Agregar Matrícula' : 'Nueva Persona';
            document.getElementById('f-n-c').style.display = m ? 'none' : 'block';
            document.getElementById('f-c-c').style.display = m ? 'none' : 'block';
            document.getElementById('form-view').classList.remove('hidden');
        }

        function cerrarF() { document.getElementById('form-view').classList.add('hidden'); }

        async function save() {
            const n = document.getElementById('in-n').value;
            const v = document.getElementById('in-v').value;
            if(!isMat && !n) return alert('Nombre Requerido');
            if(isMat && !v) return alert('Matrícula Requerida');

            const payload = { 
                nombre: isMat ? 'MATRÍCULA: ' + v : n, 
                ci: document.getElementById('in-c').value, 
                domicilio: document.getElementById('in-d').value, 
                telefono: document.getElementById('in-t').value, 
                vehiculo1: v, 
                notas: document.getElementById('in-no').value 
            };

            try {
                const r = await fetch(SB + '/rest/v1/personas', {
                    method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                    body: JSON.stringify(payload)
                });
                if(r.ok) {
                    alert('GUARDADO');
                    db.unshift(payload);
                    localStorage.setItem('db_final_police', JSON.stringify(db));
                    draw(db);
                    cerrarF();
                }
            } catch(e) { alert('Error de Red'); }
        }

        function draw(data) {
            const list = document.getElementById('lista');
            list.innerHTML = data.map(p => `
                <div onclick="showDet('${p.id || p.ci || p.nombre}')" class='bg-white p-5 rounded-2xl shadow-sm border-l-8 border-blue-800 flex justify-between items-center mb-1 active:scale-95 transition-all'>
                    <div class='overflow-hidden'>
                        <h3 class='font-black uppercase text-slate-800 text-[12px] truncate'>${p.nombre || 'SIN NOMBRE'}</h3>
                        <p class='text-[10px] text-slate-400 font-black'>${p.ci ? 'CI: '+p.ci : (p.vehiculo1 ? 'MAT: '+p.vehiculo1 : '---')}</p>
                    </div>
                    <i class='fas fa-chevron-right text-slate-300'></i>
                </div>`).join('');
        }

        function showDet(id) {
            const p = db.find(x => String(x.id || x.ci || x.nombre) === String(id));
            if(!p) return;
            document.getElementById('d-n').innerText = p.nombre || 'SIN NOMBRE';
            document.getElementById('d-c').innerText = p.ci || '---';
            document.getElementById('d-d').innerText = p.domicilio || p.direccion || '---';
            document.getElementById('d-no').innerText = (p.antecedentes ? 'ANTECEDENTES:\n'+p.antecedentes+'\n\n' : '') + (p.notas || 'SIN NOTAS');
            document.getElementById('det-view').classList.remove('hidden');
        }

        function filtrar() {
            const t = document.getElementById('bus').value.toLowerCase().trim();
            if(!t) return draw(db);
            draw(db.filter(p => (p.nombre||'').toLowerCase().includes(t) || (p.ci||'').includes(t) || (p.vehiculo1||'').toLowerCase().includes(t)));
        }
    </script>
</body>
</html>
