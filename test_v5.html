
<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Editor Policial V5</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css'>
    <style>
        body { font-family: sans-serif; background: #1a202c; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #2d3748; padding: 15px; text-align: center; font-weight: bold; }
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .preview-img { width: 150px; height: 150px; border-radius: 10px; border: 3px solid white; display: none; margin-bottom: 20px; }
        .btn { background: #3182ce; color: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 300px; text-align: center; font-weight: bold; margin-bottom: 15px; cursor: pointer; text-decoration: none; border: none; font-size: 16px; }
        .btn-secondary { background: #4a5568; }
        
        /* Modal */
        #modal { position: fixed; inset: 0; background: black; display: none; flex-direction: column; z-index: 100; }
        .cropper-box { flex: 1; position: relative; overflow: hidden; }
        #image-to-crop { display: block; max-width: 100%; }
        .footer { padding: 20px; display: flex; gap: 10px; background: black; }
        .btn-save { background: #38a169; flex: 2; }
        .btn-cancel { background: #e53e3e; flex: 1; }
    </style>
</head>
<body>
    <div class='header'>PRUEBA DE EDITOR V5</div>
    <div class='main'>
        <img id='final-preview' class='preview-img'>
        <label class='btn'>
            📸 TOMAR FOTO
            <input type='file' accept='image/*' capture='environment' style='display:none' onchange='loadFile(this)'>
        </label>
        <label class='btn btn-secondary'>
            📁 GALERÍA
            <input type='file' accept='image/*' style='display:none' onchange='loadFile(this)'>
        </label>
    </div>

    <div id='modal'>
        <div style='padding:10px; text-align:center; font-size:12px;'>ACOMODÁ Y RECORTÁ</div>
        <div class='cropper-box'>
            <img id='image-to-crop'>
        </div>
        <div class='footer'>
            <button class='btn btn-cancel' onclick='closeModal()'>CANCELAR</button>
            <button class='btn btn-save' onclick='saveResult()'>LISTO</button>
        </div>
    </div>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js'></script>
    <script>
        let cropper = null;

        function loadFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const modal = document.getElementById('modal');
                const img = document.getElementById('image-to-crop');
                img.src = e.target.result;
                modal.style.display = 'flex';
                
                if (cropper) cropper.destroy();
                
                img.onload = function() {
                    cropper = new Cropper(img, {
                        aspectRatio: NaN, // LIBRE
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 0.8,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        background: false
                    });
                };
            };
            reader.readAsDataURL(file);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            if (cropper) cropper.destroy();
        }

        function saveResult() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas();
            const preview = document.getElementById('final-preview');
            preview.src = canvas.toDataURL('image/jpeg');
            preview.style.display = 'block';
            closeModal();
        }
    </script>
</body>
</html>
