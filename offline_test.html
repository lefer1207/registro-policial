
<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Editor Libre</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css'>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #log-area { background: #fee2e2; color: #991b1b; padding: 10px; font-size: 11px; max-height: 80px; overflow-y: auto; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #f-preview { width: 180px; height: 180px; border-radius: 10px; object-fit: cover; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; display: none; }
        .btn { padding: 18px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; width: 100%; max-width: 300px; margin-bottom: 15px; text-align: center; cursor: pointer; }
        .btn-blue { background: #3182ce; color: white; }
        .btn-gray { background: #e2e8f0; color: #4a5568; }
        .btn-green { background: #38a169; color: white; }
        #modal-editor { position: fixed; inset: 0; background: black; z-index: 9999; display: none; flex-direction: column; }
        .cropper-box { flex-grow: 1; background: #000; overflow: hidden; }
        #crop-image { max-width: 100%; display: block; }
        .footer { padding: 20px; display: flex; gap: 10px; background: #000; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    </style>
</head>
<body>
    <div id='log-area'>Modo: Editor Libre Activo</div>
    <div id='main-view'>
        <img id='f-preview'>
        <label class='btn btn-blue'>
            📸 SACAR FOTO
            <input type='file' accept='image/*' capture='environment' style='display:none' onchange='processFile(this)'>
        </label>
        <label class='btn btn-gray'>
            📁 GALERÍA
            <input type='file' accept='image/*' style='display:none' onchange='processFile(this)'>
        </label>
    </div>

    <div id='modal-editor'>
        <div style='color:white; padding:15px; text-align:center; font-size:12px;'>AJUSTÁ LOS BORDES DEL RECUADRO</div>
        <div class='cropper-box'>
            <img id='crop-image'>
        </div>
        <div class='footer'>
            <button class='btn btn-gray' style='flex:1' onclick='closeEditor()'>ATRÁS</button>
            <button class='btn btn-green' style='flex:2' onclick='saveCrop()'>LISTO</button>
        </div>
    </div>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js'></script>
    <script>
        let cropper = null;
        function log(m) { document.getElementById('log-area').innerHTML += '<br>• ' + m; }

        function processFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => openEditor(e.target.result);
            reader.readAsDataURL(file);
        }

        function openEditor(src) {
            const modal = document.getElementById('modal-editor');
            const img = document.getElementById('crop-image');
            modal.style.display = 'flex';
            img.src = src;
            if (cropper) cropper.destroy();
            img.onload = () => {
                cropper = new Cropper(img, {
                    viewMode: 1,
                    dragMode: 'crop', // Permite crear recuadros nuevos
                    autoCropArea: 0.8,
                    background: false,
                    modal: true,
                    guides: true,
                    center: true,
                    highlight: true,
                    cropBoxMovable: true, // Se puede mover el recuadro
                    cropBoxResizable: true, // Se pueden ajustar las esquinas
                    toggleDragModeOnDblclick: true,
                    ready() { log('Editor libre listo'); }
                });
            };
        }

        function closeEditor() {
            document.getElementById('modal-editor').style.display = 'none';
            if (cropper) cropper.destroy();
        }

        function saveCrop() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas();
            document.getElementById('f-preview').src = canvas.toDataURL('image/jpeg', 0.8);
            document.getElementById('f-preview').style.display = 'block';
            closeEditor();
        }
    </script>
</body>
</html>
