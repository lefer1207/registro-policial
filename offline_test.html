
<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Editor Policial Pro</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css'>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: #000; margin: 0; height: 100vh; overflow: hidden; }
        
        #main-view { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a202c; padding: 20px; }
        #f-preview { width: 180px; height: 180px; border-radius: 12px; object-fit: cover; border: 4px solid white; margin-bottom: 30px; display: none; }
        
        .btn { padding: 20px; border: none; border-radius: 15px; font-weight: bold; font-size: 18px; width: 100%; max-width: 320px; margin-bottom: 20px; text-align: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-blue { background: #3182ce; color: white; }
        .btn-gray { background: #edf2f7; color: #2d3748; }
        .btn-green { background: #38a169; color: white; }

        /* Pantalla completa del editor */
        #modal-editor { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; }
        .editor-header { padding: 15px; color: white; text-align: center; font-size: 14px; background: #000; font-weight: bold; }
        
        .cropper-wrapper { flex-grow: 1; position: relative; background: #000; overflow: hidden; }
        #crop-image { display: block; max-width: 100%; }
        
        .editor-footer { padding: 20px; display: flex; gap: 15px; background: #000; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        
        /* Ajustes para Cropper en móvil */
        .cropper-view-box, .cropper-face { border-radius: 0; }
        .cropper-line, .cropper-point { background-color: #3182ce; height: 10px; width: 10px; opacity: 0.8; }
        .cropper-point.point-se { width: 30px; height: 30px; opacity: 0.5; } /* Punto de agarre más grande */
    </style>
</head>
<body>
    <div id='main-view'>
        <img id='f-preview'>
        <label class='btn btn-blue'>
            📸 SACAR FOTO
            <input type='file' accept='image/*' capture='environment' style='display:none' onchange='handleFile(this)'>
        </label>
        <label class='btn btn-gray'>
            📁 GALERÍA
            <input type='file' accept='image/*' style='display:none' onchange='handleFile(this)'>
        </label>
    </div>

    <div id='modal-editor'>
        <div class='editor-header'>MOVER LA FOTO O AJUSTAR EL RECUADRO</div>
        <div class='cropper-wrapper'>
            <img id='crop-image'>
        </div>
        <div class='editor-footer'>
            <button class='btn btn-gray' style='flex:1; margin:0' onclick='cerrar()'>ATRÁS</button>
            <button class='btn btn-green' style='flex:2; margin:0' onclick='guardar()'>ACEPTAR</button>
        </div>
    </div>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js'></script>
    <script>
        let cropper = null;

        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const modal = document.getElementById('modal-editor');
                const img = document.getElementById('crop-image');
                modal.style.display = 'flex';
                img.src = e.target.result;
                
                if (cropper) cropper.destroy();

                img.onload = () => {
                    cropper = new Cropper(img, {
                        viewMode: 1,
                        dragMode: 'move', // Por defecto mueve la foto
                        autoCropArea: 0.8,
                        background: false,
                        responsive: true,
                        restore: false,
                        checkOrientation: true,
                        modal: true,
                        guides: true,
                        center: true,
                        highlight: false,
                        cropBoxMovable: true, // Permitir mover el recuadro
                        cropBoxResizable: true, // Permitir ajustar tamaño
                        ready() {
                            console.log('Editor Ultra listo');
                        }
                    });
                };
            };
            reader.readAsDataURL(file);
            input.value = ''; // Limpiar para permitir repetir
        }

        function cerrar() {
            document.getElementById('modal-editor').style.display = 'none';
            if (cropper) cropper.destroy();
        }

        function guardar() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ imageSmoothingQuality: 'high' });
            const preview = document.getElementById('f-preview');
            preview.src = canvas.toDataURL('image/jpeg', 0.8);
            preview.style.display = 'block';
            cerrar();
        }
    </script>
</body>
</html>
