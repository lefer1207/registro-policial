
<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Editor de Fotos Pro</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css'>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #000; margin: 0; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #header { padding: 15px; text-align: center; background: #111; font-weight: bold; border-bottom: 1px solid #333; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; padding: 20px; }
        
        #f-preview { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #3182ce; margin-bottom: 20px; display: none; }
        .welcome-msg { text-align: center; color: #a0aec0; margin-bottom: 30px; }
        
        .btn { padding: 16px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; max-width: 300px; margin-bottom: 12px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-primary { background: #3182ce; color: white; }
        .btn-secondary { background: #2d3748; color: white; }
        .btn-success { background: #38a169; color: white; }
        
        /* Modales */
        .full-modal { position: fixed; inset: 0; background: black; z-index: 5000; display: none; flex-direction: column; }
        #video-preview { width: 100%; height: 100%; object-fit: cover; }
        
        /* Contenedor del Cropper */
        .cropper-area { flex-grow: 1; position: relative; background: #1a1a1a; overflow: hidden; }
        #crop-image { display: block; max-width: 100%; }
        
        .footer-controls { padding: 20px; display: flex; gap: 10px; background: #000; }
        
        #status-log { position: fixed; top: 10px; left: 10px; font-size: 10px; color: #4ade80; z-index: 9999; pointer-events: none; }
    </style>
</head>
<body>
    <div id='status-log'></div>
    <div id='header'>REGISTRO POLICIAL - FOTO</div>
    
    <div id='main-view'>
        <img id='f-preview'>
        <div id='empty-msg' class='welcome-msg'>No hay foto seleccionada</div>
        
        <button class='btn btn-primary' onclick='abrirCamara()'>📸 SACAR FOTO</button>
        <label class='btn btn-secondary'>
            📁 SUBIR DE GALERÍA
            <input type='file' accept='image/*' style='display:none' onchange='subirDeGaleria(event)'>
        </label>
        <button id='btn-reset' class='btn btn-secondary' style='display:none' onclick='location.reload()'>LIMPIAR TODO</button>
    </div>

    <!-- Modal de Cámara -->
    <div id='modal-camara' class='full-modal'>
        <video id='video-preview' autoplay playsinline></video>
        <div class='footer-controls'>
            <button class='btn btn-secondary' style='flex:1' onclick='cerrarCamara()'>CANCELAR</button>
            <button class='btn btn-primary' style='flex:2' onclick='tomarCaptura()'>CAPTURAR</button>
        </div>
    </div>

    <!-- Modal de Recorte -->
    <div id='modal-recorte' class='full-modal'>
        <div id='header' style='background:black; font-size: 14px;'>PELLIZCÁ PARA ZOOM • ARRASTRÁ LA FOTO</div>
        <div class='cropper-area'>
            <img id='crop-image'>
        </div>
        <div class='footer-controls'>
            <button class='btn btn-secondary' style='flex:1' onclick='cerrarRecorte()'>CANCELAR</button>
            <button class='btn btn-success' style='flex:2' onclick='procesarRecorte()'>LISTO</button>
        </div>
    </div>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js'></script>
    <script>
        let stream = null;
        let cropper = null;

        function log(msg) {
            console.log(msg);
            const el = document.getElementById('status-log');
            el.innerText = msg;
        }

        function abrirCamara() {
            log('Iniciando cámara...');
            const modal = document.getElementById('modal-camara');
            modal.style.display = 'flex';
            
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
            })
            .then(s => {
                stream = s;
                document.getElementById('video-preview').srcObject = s;
                log('Cámara lista');
            })
            .catch(err => {
                log('Error cámara: ' + err.message);
                alert('No se pudo abrir la cámara. Intentá subiendo desde galería.');
                cerrarCamara();
            });
        }

        function cerrarCamara() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('modal-camara').style.display = 'none';
        }

        function tomarCaptura() {
            log('Capturando...');
            const video = document.getElementById('video-preview');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            cerrarCamara();
            iniciarEditor(dataUrl);
        }

        function subirDeGaleria(e) {
            const file = e.target.files[0];
            if(!file) return;
            log('Cargando archivo...');
            const reader = new FileReader();
            reader.onload = ev => iniciarEditor(ev.target.result);
            reader.readAsDataURL(file);
        }

        function iniciarEditor(dataUrl) {
            log('Iniciando editor...');
            const modal = document.getElementById('modal-recorte');
            const img = document.getElementById('crop-image');
            
            modal.style.display = 'flex';
            img.src = dataUrl;
            
            if(cropper) cropper.destroy();

            img.onload = function() {
                log('Imagen lista para cropper');
                cropper = new Cropper(img, {
                    aspectRatio: 1,
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.8,
                    background: false,
                    modal: true,
                    guides: false,
                    center: true,
                    highlight: false,
                    cropBoxMovable: false,
                    cropBoxResizable: false,
                    toggleDragModeOnDblclick: false,
                    ready() {
                        log('Cropper listo y funcionando');
                    }
                });
            };
        }

        function cerrarRecorte() {
            document.getElementById('modal-recorte').style.display = 'none';
            if(cropper) cropper.destroy();
        }

        function procesarRecorte() {
            if(!cropper) {
                log('Error: Cropper no inicializado');
                return;
            }
            log('Recortando...');
            const canvas = cropper.getCroppedCanvas({ width: 500, height: 500, imageSmoothingQuality: 'high' });
            const result = canvas.toDataURL('image/jpeg', 0.8);
            
            const preview = document.getElementById('f-preview');
            preview.src = result;
            preview.style.display = 'block';
            
            document.getElementById('empty-msg').style.display = 'none';
            document.getElementById('btn-reset').style.display = 'block';
            
            log('¡Recorte completado!');
            cerrarRecorte();
        }
    </script>
</body>
</html>
